name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 03:17 UTC: the Windows matrix runs here instead of on every push,
    # because Windows runner minutes count double on private repositories.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Smaller debug artifacts: the full test build of the workspace otherwise fills the
  # runner disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust-linux:
    name: Rust (ubuntu-latest)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Rust-only builds use a placeholder UI page; release builds refuse it.
      TENKO_UI_STUB: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        # The hosted runner ships toolchains this build never uses.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  rust-windows:
    name: Rust (windows-latest, nightly schedule)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      # Rust-only builds use a placeholder UI page; release builds refuse it.
      TENKO_UI_STUB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  audit:
    name: cargo-audit
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  ui:
    name: UI
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Keep the bundle for the embedded build
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  e2e:
    name: End-to-end (Playwright)
    # The server with the embedded UI, driven by a browser (WP1.11).
    needs: ui
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Build the server with the real UI
        run: cargo build -p tenko --locked
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: ui
        env:
          TENKO_BIN: ${{ github.workspace }}/target/debug/tenko
        run: npm run e2e
      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/e2e/.artifacts/
          retention-days: 14

  rust-embedded-ui:
    name: Rust with the built UI
    # The UI is built before Rust (ADR 0008); this build embeds the real bundle, without
    # TENKO_UI_STUB.
    needs: ui
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Build
        run: cargo build -p tenko --locked
      - name: OpenAPI drift
        # The committed document must equal the generated one (E3); this job already
        # built the binary.
        run: |
          ./target/debug/tenko openapi > "$RUNNER_TEMP/openapi.json"
          diff -u docs/api/openapi.json "$RUNNER_TEMP/openapi.json"

  # ---------------------------------------------------------------------------
  # PROPOSAL for .github/workflows/ci.yml: add this job under `jobs:` (it is indented for
  # that). Nothing else in the file changes.
  #
  # Changelog rule (OPS-23). Every change to the product adds an entry under
  # "## [Unreleased]" in CHANGELOG.md, because that section becomes the release notes that
  # running installations show. The product is `crates/**` and `ui/src/**`, except tests
  # (directories named tests, benches or fixtures; *.test.ts and *.test.tsx), generated code
  # (ui/src/api/generated, ui/src/i18n/generated) and test support (ui/src/app/testing,
  # ui/src/api/mock). The check compares the Unreleased section at the base of the change
  # with the one at its head; see scripts/README.md for the full rule.
  #
  #   - pull request: base is the base commit of the pull request;
  #   - push to main: base is the commit before the push;
  #   - a first push (all-zero base) or a base that no longer exists passes with a note.
  #
  # The ONLY override is the label `no-changelog` on a pull request, for changes nobody
  # outside the team can see (a refactoring, a CI change under crates/). The label is read
  # from the API when the job runs, not from the event payload, so adding the label and
  # re-running the job is enough; the job passes without running the check. There is no
  # override for pushes: a direct push to main that changes the product carries an entry.
  #
  # The job also runs the tests of the scripts themselves and validates the changelog file,
  # so a broken CHANGELOG.md is caught even when no product path changed.
  changelog:
    name: Changelog
    # Not on the nightly schedule or on manual runs: there is no base to compare with.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # to read the labels of the pull request
    steps:
      - uses: actions/checkout@v5
        with:
          # The check needs the history between the base and the head.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Look for the no-changelog label
        id: override
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if grep -qx 'no-changelog' <<< "$labels"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The label no-changelog is set: the entry check is skipped."
          fi
      # Plain Node, no packages. A quoted glob: Node expands it itself, and `node --test
      # scripts/` is not accepted by Node 22.
      - name: Test the scripts
        run: node --test "scripts/*.test.mjs"
      - name: Validate CHANGELOG.md
        run: node scripts/changelog.mjs validate
      - name: Entry for product changes
        if: steps.override.outputs.skip != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/changelog.mjs check --base "$BASE"
