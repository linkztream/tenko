# Release workflow (OPS-23, OPS-24).
#
# A release is made by pushing a tag `vX.Y.Z` (or `vX.Y.Z-rc.1`) on a commit of main whose
# changelog has the section `## [X.Y.Z] - <date>` and whose crates/tenko/Cargo.toml has
# `version = "X.Y.Z"`. The workflow
#
#   1. verify      resolves the tag to its commit (a tag by its full ref name, never a branch
#                  of that name), checks that the commit is on main, and checks the tag against
#                  the crate version and the changelog. Every later job builds that commit; the
#                  tag name is not resolved again, so a tag moved during the run changes nothing;
#   2. ui          installs the web UI's dependencies without their install scripts, audits the
#                  whole dependency tree (npm audit, blocking on high and critical), then builds
#                  and tests the web UI once;
#   3. build       builds the binaries for Linux and Windows with the real UI embedded. The Linux
#                  binary is static, built for x86_64-unknown-linux-musl (S3-Q10, OPS-01), so one
#                  file runs on every distribution; the job fails when it is not static;
#   4. smoke-linux runs the Linux binary in a Debian 12 and a RHEL 9 compatible container
#                  (version, config check, a real start and a stop with SIGTERM);
#      sign-binary (WP6.7) signs the Windows binary with Authenticode when a certificate is
#                  configured, in a job of its own that holds the signing secrets and runs
#                  nothing else (below);
#      msi         builds the Windows MSI from the signed binary (deploy/windows/build-msi.ps1)
#                  and the package of the upgrade test; sign-msi signs the MSI, and msi-smoke
#                  installs, upgrades and removes the signed package on the runner
#                  (deploy/windows/msi-smoke.ps1);
#   5. image-build builds the container image from the Linux binary of `build`, the file the
#                  smoke runs started and the round tests, on a base image pinned by digest
#                  (deploy/Dockerfile): no second build of the binary exists. The image is
#                  written to an OCI archive and pushed later, by `image`;
#   6. sbom        writes the CycloneDX SBOMs (L1.9 of docs/plans/security-audit-plan.md): the
#                  two binaries from Cargo.lock (cargo cyclonedx, restricted to the crates
#                  `cargo tree` lists by scripts/sbom-prune.mjs), the web UI from
#                  ui/package-lock.json (cyclonedx-npm, installed from the lock file of
#                  scripts/sbom-tools) and the image from the archive (syft);
#   7. manifest    builds releases.json and SHA256SUMS (scripts/release-manifest.mjs), which lists
#                  releases.json, after checking every earlier release of the previous manifest
#                  against the SHA256SUMS its own release published; adds the installers and the
#                  SBOMs to SHA256SUMS, and hands the release files on as one artifact, so that
#                  the files attested are the files published;
#   8. attest      holds id-token: write and attestations: write (L1.10): a SLSA build provenance
#                  attestation for every release file and an SBOM attestation binding each SBOM
#                  to its binary, with GitHub's own actions/attest and nothing else;
#   9. security    the lab round of layer 2 on the binary being released, from the tag's commit;
#  10. image       pushes the archive of `image-build` to ghcr.io by digest, with no tag, only
#                  after the security round and the attestations passed; nothing is pullable by
#                  name before `publish`, and a release that fails leaves no image behind a tag;
#  11. attest-image the provenance attestation of the pushed digest and the SBOM attestation of
#                  the image, pushed to the registry beside it;
#  12. publish     gives the image its tags (<version>, and latest for a stable release, S3-Q9),
#                  takes the release text from the changelog (scripts/changelog.mjs notes) and
#                  creates the GitHub release with the files of `manifest`.
#
# Running installations read releases.json from the latest release to learn about updates;
# the file names tenko-<version>-<platform>[.exe] are the contract with scripts/README.md
# (the platform of the musl binary stays linux-x86_64). SECURITY.md, "Verifying a release",
# says how a user checks the attestations with `gh attestation verify`.
#
# Re-running: when a run fails before `publish`, re-run the failed jobs. When `publish`
# failed after the release was created, delete that release (not the tag) and re-run; the
# image tags are written again from the same digest. The workflow_dispatch trigger builds an
# existing tag by hand; it never creates a tag, and it accepts a tag only (on main).
#
# Not yet here: signatures a node verifies (API-19). The provenance of `attest` proves that
# this repository's workflow built a file, not that the owner released it: whoever can push a
# tag gets the same proof. Section 7.2 of docs/plans/security-audit-plan.md proposes the
# remedy: a key GitHub never holds (the owner's hardware key) signs SHA256SUMS, and with it
# releases.json, after the security round, outside this workflow; the places that change for
# it are marked SIGNING below. (WP6.7) The Windows binary and the MSI are signed with
# Authenticode when the secrets WINDOWS_SIGNING_CERT_PFX (the PFX file, base64) and
# WINDOWS_SIGNING_PASSWORD exist, and ship unsigned with a notice in the job log otherwise
# (deploy/windows/sign.ps1, deploy/windows/README.md "Signing"). The secrets reach the jobs
# `sign-binary` and `sign-msi` only: each checks out the signing script alone, downloads the
# built file, signs it from the certificate store (the password never on a command line) and
# uploads it; no build, no package restore and no third-party action runs where the secrets
# are, so nothing a dependency's build script does can reach them.
#
# Every `uses:` is pinned to a full commit SHA with its tag in a comment (L1.6); the version
# updates for github-actions in .github/dependabot.yml move the pins. dtolnay/rust-toolchain
# has no release tags: its pin is a commit of its default branch, the same one ci.yml uses.
# The toolchain is the exact version rust-toolchain.toml names (OD-10 of the release review),
# read by the step before each use of the action, which at this commit installs nothing
# without the input; the file is bumped in its own commit.

# Every Linux job runs on GitHub's hosted runners (ubuntu-latest) and the Windows jobs on
# windows-latest; no job runs on a machine of the owner's (see ci.yml).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.2.0"
        required: true
        type: string

# Least privilege: every job runs with read access only except four, which raise what they
# need: `attest` (id-token: write and attestations: write, to sign through Sigstore and store
# the attestations), `image` (packages: write, to push by digest), `attest-image` (id-token:
# write, attestations: write and packages: write, to push the attestations of the image beside
# it) and `publish` (contents: write, to create the release, and packages: write, to tag the
# image). The SBOM tools run in `sbom`, which holds no token able to write. The signing
# secrets exist in `sign-binary` and `sign-msi` only.
permissions:
  contents: read

# Two runs for one tag never overlap, and a running release is never canceled.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The tag being released: the pushed tag, or the input of a manual run. Shell steps read
  # it from the environment; it is never pasted into a script with ${{ }}. Only `verify`
  # resolves it; every other job checks out the commit `verify` found.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/linkztream/tenko
  DOWNLOAD_URL: https://github.com/linkztream/tenko/releases/download

jobs:
  # -------------------------------------------------------------------------------------
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      # The commit of the tag; every later job checks this out instead of the tag name.
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Every branch and tag with the whole history: the tag is resolved below by its
          # full ref name and its commit is checked against main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Tag, commit on main, crate version and changelog
        id: tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag '$TAG' is not vX.Y.Z or vX.Y.Z-<pre-release>."
            exit 1
          fi
          version="${TAG#v}"
          case "$version" in
            *+*) echo "::error::The tag '$TAG' has build metadata; container tags cannot hold '+'."; exit 1 ;;
          esac
          # A tag, by its full ref name: a branch called the same is refused, not resolved.
          if git show-ref --verify --quiet "refs/remotes/origin/$TAG"; then
            echo "::error::A branch named '$TAG' exists; the name is ambiguous. Release from a tag only."
            exit 1
          fi
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
            echo "::error::There is no tag '$TAG'."
            exit 1
          fi
          # The tag's commit must be on main: a release is never made from another branch.
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::The commit $sha of '$TAG' is not on main."
            exit 1
          fi
          git checkout --quiet "$sha"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/tenko/Cargo.toml | head -n 1)"
          if [ "$crate" != "$version" ]; then
            echo "::error::The tag says $version but crates/tenko/Cargo.toml says '$crate'. Bump the version, commit, and tag that commit."
            exit 1
          fi
          # Fails when CHANGELOG.md has no section "## [$version] - <date>" (or does not parse).
          node scripts/changelog.mjs notes "$version" > /dev/null
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $sha (prerelease: $prerelease)"

  # -------------------------------------------------------------------------------------
  ui:
    name: UI
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      # No npm cache in a release: the packages come from the registry, checked against
      # package-lock.json, as the Rust build below has no cache either.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        # Without install scripts: the UI's dependencies need none to build, typecheck, lint
        # and test, and a package's script does not run on the runner that builds the bundle.
        run: npm ci --ignore-scripts
      # L1.4: the whole tree, development dependencies included, because the bundle is
      # produced by the build chain and not only by what it embeds. The full audit is printed
      # as a report (moderate and low advisories); a high or critical advisory anywhere in the
      # tree stops the release in the next step.
      - name: Audit all dependencies (report)
        run: |
          status=0
          npm audit > "$RUNNER_TEMP/npm-audit.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/npm-audit.txt"
          {
            echo "### npm audit, all dependencies (report)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/npm-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::warning::npm audit lists advisories (above); those at high or critical block the release."
          fi
      - name: Audit all dependencies (blocks on high and critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.platform }})
    needs: [verify, ui]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            exe: ""
            artifact: binary-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            exe: ".exe"
            # Unsigned: `sign-binary` signs it and uploads binary-windows-x86_64.
            artifact: binary-windows-x86_64-unsigned
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: The toolchain of rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          grep -Eq '^channel = "[0-9]+\.[0-9]+\.[0-9]+"$' rust-toolchain.toml
          sed -n 's/^channel = "\(.*\)"$/toolchain=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # The exact version of rust-toolchain.toml, which cargo's own override reads too.
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - name: Install the musl C compiler
        # musl-tools provides musl-gcc, which the C code of aws-lc-sys, ring and jemalloc (the
        # allocator of the musl binary) is built with for the musl target; jemalloc's build
        # also runs make, which the runner image has. Nothing else is needed (no cmake, perl
        # or clang).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      # No Rust cache here: a release is built from a clean state. TENKO_UI_STUB is not set,
      # so the build embeds the real UI and refuses the placeholder page.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ui-dist
          path: ui/dist
      - name: Build
        shell: bash
        run: cargo build --release --locked -p tenko --target "$TARGET"
      - name: Check that the Linux binary is static
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/tenko"
          file "$bin"
          if ! file "$bin" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::The Linux binary is not statically linked."
            exit 1
          fi
          # ldd prints 'not a dynamic executable' (exit 1) or 'statically linked' for a static one.
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "::error::ldd lists shared libraries for the Linux binary."
            exit 1
          fi
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/tenko${EXE}"
          out="$("$bin" --version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::The binary reports '$out', expected version $VERSION."; exit 1 ;;
          esac
          "$bin" upgrade format
      - name: Name the binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${TARGET}/release/tenko${EXE}" "dist/tenko-${VERSION}-${PLATFORM}${EXE}"
          # SIGNING (later, API-19): no signature is made here. Section 7.2 of
          # docs/plans/security-audit-plan.md: a key in this workflow would prove no more than
          # the provenance of the `attest` job; the owner's hardware key signs SHA256SUMS, which
          # lists this file, after the security round. Windows: Authenticode in `sign-binary`,
          # not here, where the build scripts of every dependency have just run.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.artifact }}
          path: dist/tenko-${{ needs.verify.outputs.version }}-${{ matrix.platform }}${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------------------
  smoke-linux:
    name: Smoke (${{ matrix.name }})
    # The static binary must run on the distributions the product supports (R33). The
    # images carry no bash, no curl and no glibc-specific tooling the binary could lean on.
    needs: [verify, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Debian 12
            image: debian:12-slim
          - name: RHEL 9 compatible
            image: rockylinux/rockylinux:9-minimal
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SMOKE_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: binary-linux-x86_64
          path: dist
      - name: Run the binary in ${{ matrix.name }}
        run: |
          set -euo pipefail
          chmod +x "dist/tenko-${VERSION}-linux-x86_64"
          # The script that runs inside the container: POSIX sh only (minimal images have no
          # bash). It uses `sh`, `kill`, `sleep` and `mktemp` and nothing else.
          cat > "$RUNNER_TEMP/smoke.sh" <<'SMOKE_END'
          #!/bin/sh
          # In: TENKO_BIN (binary), TENKO_VERSION, SMOKE_CONFIG (example config), SMOKE_PORT.
          set -eu
          bin="$TENKO_BIN"
          work="$(mktemp -d)"
          export TENKO_DATA_DIR="$work/data"
          mkdir -p "$TENKO_DATA_DIR"
          # A file KEK of 64 hexadecimal digits (a test value, never a real key).
          printf '%s\n' 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef > "$work/kek.key"
          chmod 600 "$work/kek.key"
          export TENKO_KEK__PROVIDER=file TENKO_KEK__PATH="$work/kek.key" TENKO_KEK__ALLOW_PLAIN=true
          export TENKO_SERVER__LISTEN="127.0.0.1:$SMOKE_PORT"
          # The internal CA certificate must name the loopback address the probe connects to.
          export TENKO_TLS__ADDRESSES=127.0.0.1

          echo "== version"
          out="$("$bin" --version)"
          echo "$out"
          case "$out" in *"$TENKO_VERSION"*) ;; *) echo "the version is missing from the output"; exit 1 ;; esac

          echo "== upgrade format"
          format="$("$bin" upgrade format)"
          echo "$format"
          case "$format" in ''|*[!0-9]*) echo "not a number"; exit 1 ;; esac

          echo "== config check"
          "$bin" config check --config "$SMOKE_CONFIG" > /dev/null

          echo "== serve"
          "$bin" serve --config "$SMOKE_CONFIG" > "$work/serve.log" 2>&1 &
          pid=$!
          ready=0
          i=0
          while [ "$i" -lt 60 ]; do
            if ! kill -0 "$pid" 2> /dev/null; then break; fi
            if [ -f "$TENKO_DATA_DIR/tls/ca-root.pem" ] &&
              "$bin" health --url "https://127.0.0.1:$SMOKE_PORT" --ca-file "$TENKO_DATA_DIR/tls/ca-root.pem" 2> /dev/null; then
              ready=1
              break
            fi
            i=$((i + 1))
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "tenko serve did not become ready"
            cat "$work/serve.log"
            kill "$pid" 2> /dev/null || true
            exit 1
          fi
          kill -TERM "$pid"
          status=0
          wait "$pid" || status=$?
          if [ "$status" != 0 ]; then
            echo "tenko serve exited with status $status after SIGTERM"
            cat "$work/serve.log"
            exit 1
          fi
          echo "== ok"
          SMOKE_END
          docker run --rm \
            -v "$PWD/dist:/opt/tenko:ro" \
            -v "$PWD/deploy/tenko.example.toml:/smoke/config.toml:ro" \
            -v "$RUNNER_TEMP/smoke.sh:/smoke/smoke.sh:ro" \
            -e "TENKO_BIN=/opt/tenko/tenko-${VERSION}-linux-x86_64" \
            -e "TENKO_VERSION=${VERSION}" \
            -e SMOKE_CONFIG=/smoke/config.toml \
            -e SMOKE_PORT=18443 \
            "$SMOKE_IMAGE" sh /smoke/smoke.sh
      # WP6.6: the installer with this binary, unattended and with --no-start (the container
      # has no systemd): the account, /etc/tenko, the key file and the unit, tenko config
      # check on the written file, a rerun that changes nothing, and --uninstall --purge.
      # The minimal RHEL image lacks useradd, which a RHEL host has (shadow-utils).
      - name: Install with deploy/install.sh in ${{ matrix.name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/install-smoke.sh" <<'INSTALL_END'
          set -euo pipefail
          if ! command -v useradd > /dev/null 2>&1; then microdnf install -y shadow-utils > /dev/null; fi
          bin="/opt/tenko/tenko-${TENKO_VERSION}-linux-x86_64"
          bash /opt/install.sh --yes --no-start --binary "$bin" --host-name tenko.example.test
          /usr/local/bin/tenko config check --config /etc/tenko/tenko.toml > /dev/null
          test -f /etc/tenko/kek.key && test -f /etc/systemd/system/tenko.service && id tenko
          bash /opt/install.sh --yes --no-start --binary "$bin" > /tmp/rerun.log 2>&1
          grep -q 'nothing was changed' /tmp/rerun.log || { cat /tmp/rerun.log; exit 1; }
          bash /opt/install.sh --yes --uninstall --purge
          test ! -e /usr/local/bin/tenko && test ! -e /etc/tenko
          echo "== install.sh ok"
          INSTALL_END
          docker run --rm \
            -v "$PWD/dist:/opt/tenko:ro" \
            -v "$PWD/deploy/install.sh:/opt/install.sh:ro" \
            -v "$RUNNER_TEMP/install-smoke.sh:/opt/install-smoke.sh:ro" \
            -e "TENKO_VERSION=${VERSION}" \
            "$SMOKE_IMAGE" bash /opt/install-smoke.sh

  # -------------------------------------------------------------------------------------
  # WP6.7: the Authenticode signature of the Windows binary, in a job that holds the signing
  # secrets and runs nothing else: the signing script of the tag's commit (and no other file
  # of the repository), the built file, signtool. The build job, where the build scripts of
  # every dependency run, never sees the secrets. Without the secrets the script leaves a
  # notice and the binary goes on unsigned. The release asset, the binary in the MSI and the
  # binary that in-app updates install are this one file.
  #
  # The alternative to a PFX certificate is Azure Artifact Signing (formerly Trusted
  # Signing): azure/login with OIDC and the action azure/trusted-signing-action in place of
  # sign.ps1, here and in sign-msi. It needs an Azure subscription and, today, an
  # organization as the subscriber.
  sign-binary:
    name: Sign the Windows binary
    needs: [verify, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          # The signing script alone.
          sparse-checkout: deploy/windows/sign.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: binary-windows-x86_64-unsigned
          path: bin
      - name: Sign
        shell: pwsh
        env:
          SIGNING_CERT_PFX: ${{ secrets.WINDOWS_SIGNING_CERT_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: ./deploy/windows/sign.ps1 -File "bin/tenko-$env:VERSION-windows-x86_64.exe"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binary-windows-x86_64
          path: bin/tenko-${{ needs.verify.outputs.version }}-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------------------
  # WP6.7: the Windows MSI (deploy/windows/README.md, "MSI installer"), from the signed
  # binary. This job restores the WiX toolset and its extensions from NuGet, so it holds no
  # secret: `sign-msi` signs what it built.
  msi:
    name: MSI (windows-x86_64)
    needs: [verify, sign-binary]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      # The runner image has the .NET SDK; the WiX version comes from .config/dotnet-tools.json.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: binary-windows-x86_64
          path: bin
      - name: Build the MSI
        run: ./deploy/windows/build-msi.ps1 -Binary "bin/tenko-$env:VERSION-windows-x86_64.exe" -Version $env:VERSION -Out dist
      - name: Build the upgrade test package
        # The same binary as a higher MSI version (patch + 1), for the upgrade step of the
        # smoke test only; it is never published and never signed.
        run: |
          if ($env:VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)') { throw "unexpected version $env:VERSION" }
          $next = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          ./deploy/windows/build-msi.ps1 -Binary "bin/tenko-$env:VERSION-windows-x86_64.exe" -Version $env:VERSION -MsiVersion $next -Out upgrade-test
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installer-windows-x86_64-unsigned
          path: dist/tenko-${{ needs.verify.outputs.version }}-windows-x86_64.msi
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: msi-upgrade-test
          path: upgrade-test/tenko-${{ needs.verify.outputs.version }}-windows-x86_64.msi
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------------------
  # WP6.7: the signature of the MSI, in a job of the same shape as sign-binary.
  sign-msi:
    name: Sign the MSI
    needs: [verify, msi]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          sparse-checkout: deploy/windows/sign.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-windows-x86_64-unsigned
          path: dist
      - name: Sign
        shell: pwsh
        env:
          SIGNING_CERT_PFX: ${{ secrets.WINDOWS_SIGNING_CERT_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: ./deploy/windows/sign.ps1 -File "dist/tenko-$env:VERSION-windows-x86_64.msi"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installer-windows-x86_64
          path: dist/tenko-${{ needs.verify.outputs.version }}-windows-x86_64.msi
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------------------
  # WP6.7: install, upgrade, uninstall and purge on the runner, which runs elevated. The
  # package under test is the signed one that is published.
  msi-smoke:
    name: MSI smoke (windows-x86_64)
    needs: [verify, sign-msi]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-windows-x86_64
          path: dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: msi-upgrade-test
          path: upgrade-test
      - name: Smoke test the MSI
        run: ./deploy/windows/msi-smoke.ps1 -Msi "dist/tenko-$env:VERSION-windows-x86_64.msi" -UpgradeMsi "upgrade-test/tenko-$env:VERSION-windows-x86_64.msi" -LogDir $env:RUNNER_TEMP
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: msi-smoke-logs
          path: ${{ runner.temp }}/msi-smoke-*.log
          retention-days: 7

  # -------------------------------------------------------------------------------------
  # The container image, built from the Linux binary of `build` (OD-04 of the release
  # review): deploy/Dockerfile copies that file onto distroless/static, pinned by digest, and
  # compiles nothing, so the binary in the image is the file the smoke runs started, the
  # round tests and the provenance attestation names. The image is written to an OCI archive
  # (one manifest: no index, no attestation of the builder, as the real provenance comes from
  # `attest-image`) and pushed by `image` after the security round and the attestations. This
  # job holds no token able to write.
  image-build:
    name: Container image (build)
    needs: [verify, build, smoke-linux]
    runs-on: ubuntu-latest
    outputs:
      # The digest of the manifest in the archive, which `image` pushes under that digest.
      digest: ${{ steps.digest.outputs.digest }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: binary-linux-x86_64
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            TENKO_BINARY_SOURCE=release
            TENKO_BINARY=dist/tenko-${{ needs.verify.outputs.version }}-linux-x86_64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          push: false
          provenance: false
          sbom: false
      - name: The digest of the image
        id: digest
        run: |
          set -euo pipefail
          index="$(tar -xOf "$RUNNER_TEMP/image.tar" index.json)"
          test "$(jq -r '.manifests | length' <<< "$index")" = 1
          digest="$(jq -r '.manifests[0].digest' <<< "$index")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # The archive is content addressed: the manifest's digest is the digest of its blob.
          test "$(tar -xOf "$RUNNER_TEMP/image.tar" "blobs/sha256/${digest#sha256:}" | sha256sum | cut -d' ' -f1)" = "${digest#sha256:}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image ${IMAGE}@${digest} (not pushed yet)"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: image-oci
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------------------
  # L1.9: the SBOMs, CycloneDX JSON, one per published thing. This job reads only: it holds no
  # token able to write, and runs the third-party tools of the SBOMs (each pinned by version
  # and SHA-256, or by the integrity hashes of a lock file for cyclonedx-npm) apart from the
  # jobs that build what is published.
  sbom:
    name: SBOMs
    needs: [verify, image-build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CARGO_CYCLONEDX_VERSION: 0.5.9
      CARGO_CYCLONEDX_SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
      SYFT_VERSION: 1.55.0
      SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: The toolchain of rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          grep -Eq '^channel = "[0-9]+\.[0-9]+\.[0-9]+"$' rust-toolchain.toml
          sed -n 's/^channel = "\(.*\)"$/toolchain=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      # cargo tree and cargo metadata only: no target is installed and nothing is built.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install cargo-cyclonedx and syft
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/sbom-tools"
          mkdir -p "$tools/bin"
          cd "$tools"
          curl -fsSL -o cargo-cyclonedx.tar.xz \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CARGO_CYCLONEDX_VERSION}/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          echo "${CARGO_CYCLONEDX_SHA256}  cargo-cyclonedx.tar.xz" | sha256sum --check --strict -
          mkdir cargo-cyclonedx && tar -xJf cargo-cyclonedx.tar.xz -C cargo-cyclonedx
          bin="$(find cargo-cyclonedx -type f -name cargo-cyclonedx -print -quit)"
          test -n "$bin"
          install -m 0755 "$bin" bin/cargo-cyclonedx
          curl -fsSL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict -
          tar -xzf syft.tar.gz syft
          install -m 0755 syft bin/syft
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Install cyclonedx-npm from its lock file
        # scripts/sbom-tools/package-lock.json pins the tool and every dependency by version
        # and integrity hash; npm ci refuses anything else, and no install script runs.
        working-directory: scripts/sbom-tools
        run: npm ci --ignore-scripts
      - name: SBOMs of the binaries
        # cargo cyclonedx reads `cargo metadata`, whose resolve also lists optional
        # dependencies that the build leaves out; scripts/sbom-prune.mjs keeps the crates that
        # `cargo tree` lists for the package and target of the build (build dependencies and
        # dev-dependencies excluded, proc macros included) and says what it removed.
        run: |
          set -euo pipefail
          mkdir -p sbom
          echo "### SBOMs" >> "$GITHUB_STEP_SUMMARY"
          for pair in x86_64-unknown-linux-musl:linux-x86_64 x86_64-pc-windows-msvc:windows-x86_64; do
            target="${pair%%:*}"
            platform="${pair#*:}"
            cargo tree -e normal --target "$target" -p tenko --prefix none --locked > "$RUNNER_TEMP/tree-$platform.txt"
            rm -f crates/tenko/tenko.cdx.json
            cargo cyclonedx --format json --spec-version 1.5 --target "$target" --no-build-deps --quiet
            node scripts/sbom-prune.mjs --bom crates/tenko/tenko.cdx.json --tree "$RUNNER_TEMP/tree-$platform.txt" \
              --out "sbom/tenko-${VERSION}-${platform}.cdx.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: SBOM of the web UI
        working-directory: ui
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/sbom-tools/node_modules/.bin/cyclonedx-npm" \
            --omit dev --package-lock-only --flatten-components --output-reproducible \
            --output-file "../sbom/tenko-${VERSION}-ui.cdx.json"
          # --output-reproducible leaves the serial number out, and actions/attest takes a
          # CycloneDX document only with bomFormat, specVersion and serialNumber (its
          # src/sbom.ts): a serial number derived from the lock file keeps the output
          # reproducible and the attestation possible.
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const [file, lock] = process.argv.slice(1);
            const bom = JSON.parse(fs.readFileSync(file, "utf8"));
            const h = crypto.createHash("sha256").update(fs.readFileSync(lock)).digest("hex");
            const variant = ((parseInt(h[16], 16) & 3) | 8).toString(16);
            bom.serialNumber = `urn:uuid:${h.slice(0, 8)}-${h.slice(8, 12)}-5${h.slice(13, 16)}-${variant}${h.slice(17, 20)}-${h.slice(20, 32)}`;
            fs.writeFileSync(file, JSON.stringify(bom, null, 2) + "\n");
          ' "../sbom/tenko-${VERSION}-ui.cdx.json" package-lock.json
          jq -e '.bomFormat == "CycloneDX" and .specVersion != null and (.serialNumber | startswith("urn:uuid:"))' \
            "../sbom/tenko-${VERSION}-ui.cdx.json" > /dev/null
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: image-oci
          path: ${{ runner.temp }}/image
      - name: SBOM of the container image
        # syft reads the archive `image-build` made, the image `image` pushes later.
        run: |
          set -euo pipefail
          syft scan "oci-archive:$RUNNER_TEMP/image/image.tar" --platform linux/amd64 \
            --output "cyclonedx-json=sbom/tenko-${VERSION}-image.cdx.json"
      - name: Count the components
        run: |
          set -euo pipefail
          {
            echo
            echo "| SBOM | Components |"
            echo "|---|---|"
            for f in sbom/*.cdx.json; do
              echo "| $(basename "$f") | $(jq '.components | length' "$f") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(find sbom -name '*.cdx.json' | wc -l)" -eq 4
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------------------
  # The release files, complete, before anything is attested or published: the binaries, the
  # MSI, the SBOMs, the installers, releases.json and SHA256SUMS. `attest` attests exactly
  # these files and `publish` attaches exactly these files.
  manifest:
    name: Release files
    needs: [verify, build, smoke-linux, sign-binary, msi-smoke, sbom]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # The two binaries by name: the unsigned Windows binary of `build` is an artifact of
      # this run too and must not land here.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: binary-linux-x86_64
          path: dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: binary-windows-x86_64
          path: dist
      # WP6.7: the signed MSI; release-manifest.mjs lists it under `installers` and in SHA256SUMS.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-windows-x86_64
          path: dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sbom
          path: sbom
      - name: Data-directory format
        # The format number of this version, from the Linux binary that is being released
        # (a matrix job cannot hand one leg's output on reliably).
        run: |
          set -euo pipefail
          bin="dist/tenko-${VERSION}-linux-x86_64"
          chmod +x "$bin"
          format="$("$bin" upgrade format)"
          case "$format" in
            ''|*[!0-9]*) echo "::error::tenko upgrade format printed '$format', expected a number."; exit 1 ;;
          esac
          echo "FORMAT=$format" >> "$GITHUB_ENV"
      - name: Releases.json of the latest release
        # The manifest of the latest published release holds every earlier release; the new
        # one is added to it after each earlier release is checked against the SHA256SUMS its
        # own release published (release-manifest.mjs, --verify-previous): the asset is
        # mutable, the check is not. There is none for the very first release. (GitHub does
        # not count a pre-release as the latest release, so a pre-release is merged into the
        # manifest of the last stable release.)
        run: |
          mkdir -p prev
          gh release download --repo "$GITHUB_REPOSITORY" --pattern releases.json --dir prev || true
          if [ -f prev/releases.json ]; then
            echo "Merging into the releases.json of the latest release."
          else
            echo "::notice::No earlier releases.json found; the manifest starts with this release."
          fi
      - name: Build releases.json and SHA256SUMS
        # SHA256SUMS lists releases.json by the digest of the final text, written by the
        # same call; nothing edits releases.json after this step.
        run: |
          set -euo pipefail
          args=(
            --version "$VERSION"
            --assets dist
            --base-url "${DOWNLOAD_URL}/${TAG}"
            --image "${IMAGE}:${VERSION}"
            --format "$FORMAT"
            --out dist/releases.json
          )
          if [ -f prev/releases.json ]; then args+=(--previous prev/releases.json --verify-previous "$DOWNLOAD_URL"); fi
          node scripts/release-manifest.mjs "${args[@]}"
          # SIGNING (later, API-19): nothing is signed here. Section 7.2 of
          # docs/plans/security-audit-plan.md: the owner's hardware key signs SHA256SUMS (and
          # with it releases.json, which SHA256SUMS lists) after the security round, outside
          # this workflow, and the signature is added to the published release.
          ls -l dist
      # WP6.6: the installers as release assets, with their lines appended to SHA256SUMS
      # (not to releases.json: they are no update of a node). The Proxmox script is pinned
      # to the scripts of this tag. A signature of SHA256SUMS (SIGNING above) covers these
      # lines and those of the SBOMs below.
      - name: The installers
        run: |
          set -euo pipefail
          cp deploy/install.sh dist/install.sh
          sed "s#/linkztream/tenko/main/deploy/proxmox#/linkztream/tenko/${TAG}/deploy/proxmox#" \
            deploy/proxmox/ct/tenko.sh > dist/tenko-proxmox.sh
          grep -q "/linkztream/tenko/${TAG}/deploy/proxmox" dist/tenko-proxmox.sh
          (cd dist && sha256sum install.sh tenko-proxmox.sh >> SHA256SUMS)
          sort -k 2 -o dist/SHA256SUMS dist/SHA256SUMS
      # L1.9: the SBOMs as release assets, listed in SHA256SUMS like the installers and not in
      # releases.json (release-manifest.mjs ignores them: they are no asset of a platform).
      - name: The SBOMs
        run: |
          set -euo pipefail
          cp sbom/*.cdx.json dist/
          (cd dist && sha256sum -- *.cdx.json >> SHA256SUMS)
          sort -k 2 -o dist/SHA256SUMS dist/SHA256SUMS
          # Every file of the release but SHA256SUMS itself is listed, with the digest it has.
          (cd dist && sha256sum --check --strict SHA256SUMS)
          test "$(grep -c . dist/SHA256SUMS)" -eq "$(find dist -type f ! -name SHA256SUMS | wc -l)"
          cat dist/SHA256SUMS
          ls -l dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------------------
  # L1.10: the attestations of the release files. The job checks out nothing and runs no code
  # of this repository and no third-party action: it downloads the release files and calls
  # GitHub's own actions/attest (the action that actions/attest-build-provenance and
  # actions/attest-sbom wrap since their version 4). The attestations are signed through
  # Sigstore's public instance, recorded in its transparency log and stored on the
  # repository. The image is attested by `attest-image`, after it is pushed.
  attest:
    name: Attest
    needs: [verify, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release
          path: dist
      - name: Provenance of the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # Every binary, the MSI, the SBOMs, install.sh, tenko-proxmox.sh, releases.json and
          # SHA256SUMS, in one attestation with a subject per file.
          subject-path: dist/*
      - name: SBOM of the Linux binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/tenko-${{ needs.verify.outputs.version }}-linux-x86_64
          sbom-path: dist/tenko-${{ needs.verify.outputs.version }}-linux-x86_64.cdx.json
      - name: SBOM of the Windows binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/tenko-${{ needs.verify.outputs.version }}-windows-x86_64.exe
          sbom-path: dist/tenko-${{ needs.verify.outputs.version }}-windows-x86_64.cdx.json
      - name: SBOM of the web UI in both binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/tenko-${{ needs.verify.outputs.version }}-linux-x86_64
            dist/tenko-${{ needs.verify.outputs.version }}-windows-x86_64.exe
          sbom-path: dist/tenko-${{ needs.verify.outputs.version }}-ui.cdx.json

  # -------------------------------------------------------------------------------------
  # Layer 2 of docs/plans/security-audit-plan.md: the lab round `security` on the binary being
  # released, before anything is pushed or published (SA-Q1 (b): the deterministic rows
  # block). The reusable workflow holds contents: read and no secret; it reads the repository
  # variable SECURITY_AGE_RECIPIENT to encrypt its evidence, and uploads nothing without it.
  # It checks out the tag's commit, so its scripts and fuzz targets are those of the released
  # source also when the release was started by hand from another branch.
  security:
    name: Security round
    needs: [verify, build]
    uses: ./.github/workflows/security-round.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      commit: ${{ needs.verify.outputs.sha }}
      binary-artifact: binary-linux-x86_64
    permissions:
      contents: read

  # -------------------------------------------------------------------------------------
  # The push of the image, by digest and without a tag, after the security round and the
  # attestations of the release files: what reaches the registry is the archive `image-build`
  # made from the attested binary, and nothing is pullable by name until `publish` tags it.
  # skopeo (on the runner image) copies the archive as it is, so the digest in the registry
  # is the digest `image-build` recorded; the job checks that before and after the push.
  image:
    name: Container image (push)
    needs: [verify, image-build, attest, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      DIGEST: ${{ needs.image-build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: image-oci
          path: ${{ runner.temp }}/image
      - name: skopeo
        run: |
          set -euo pipefail
          if ! command -v skopeo > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          skopeo --version
      - name: Push by digest
        id: push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/image/image.tar"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          index="$(tar -xOf "$archive" index.json)"
          test "$(jq -r '.manifests | length' <<< "$index")" = 1
          test "$(jq -r '.manifests[0].digest' <<< "$index")" = "$DIGEST"
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          skopeo copy --preserve-digests --digestfile "$RUNNER_TEMP/pushed" \
            "oci-archive:$archive" "docker://${IMAGE}@${DIGEST}"
          test "$(cat "$RUNNER_TEMP/pushed")" = "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST} (no tag yet)"
      - name: Log out of the registry
        if: always()
        run: skopeo logout ghcr.io || true

  # -------------------------------------------------------------------------------------
  # L1.10 for the image: the provenance attestation of the digest `image` pushed and the SBOM
  # attestation binding the image's SBOM to it, both pushed to the registry beside the image
  # and stored on the repository. Like `attest`: no checkout, no repository code, GitHub's
  # own action only; the registry login is a shell step, not a third-party action.
  attest-image:
    name: Attest the image
    needs: [verify, image, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sbom
          path: sbom
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Provenance of the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          # Storage records exist for repositories of an organization only.
          create-storage-record: false
      - name: SBOM of the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: sbom/tenko-${{ needs.verify.outputs.version }}-image.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io

  # -------------------------------------------------------------------------------------
  publish:
    name: Publish the release
    # After everything: a release whose files could not be attested, whose round had a
    # blocking row fail, or whose image could not be pushed and attested, is not published,
    # and its image gets no tag.
    needs: [verify, manifest, attest, security, image, attest-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # The files of `manifest`, which `attest` attested.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release
          path: dist
      - name: Release notes
        run: node scripts/changelog.mjs notes "$VERSION" > notes.md
      - name: Tag the image
        # The tags point at the attested digest, unchanged (skopeo copies the manifest as it
        # is). A pre-release never becomes latest (S3-Q9).
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if ! command -v skopeo > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          tags=("$VERSION")
          if [ "$PRERELEASE" != "true" ]; then tags+=(latest); fi
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in "${tags[@]}"; do
            skopeo copy --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:${tag}"
            test "$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${tag}")" = "$DIGEST"
            echo "${IMAGE}:${tag} -> ${DIGEST}"
          done
          skopeo logout ghcr.io || true
      - name: Create the release
        run: |
          set -euo pipefail
          ls -l dist
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tenko DDI ${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
