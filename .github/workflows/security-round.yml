# The lab round `security` at every release (layer 2 of docs/plans/security-audit-plan.md,
# section 4.1). Two triggers:
#
#   workflow_call   from release.yml, after `verify` and `build`, before `publish`: it tests
#                   the binary being released (the artifact binary-linux-x86_64 of the same
#                   run) so the round runs on the shipped binary. SA-Q1 (b): the deterministic
#                   rows block, so `publish` lists this job in its needs.
#   workflow_dispatch  with a tag: it downloads that published release's Linux asset and
#                   checks it against the release's SHA256SUMS before testing. This is how the
#                   round is rehearsed between releases.
#
# The workspace is always the workflow's own commit (github.sha), so the round runs the
# scripts of deploy/security/ of this commit. On a dispatch the tag's tree is checked out as
# well, into release-source, and the fuzz targets of that tree are run (SOURCE); on a release
# call the workspace is the source of the binary.
#
# The job installs the node under test as a user installs it (deploy/install.sh), sets it up
# through the API under the Standard profile, and runs deploy/security/round.sh. The log of a
# run is public on this public repository, so only the row lines and counts go to the log and
# the job summary; the raw scanner output, the node's journal and any crash input go into an
# evidence bundle that is encrypted with age to the repository variable SECURITY_AGE_RECIPIENT
# (a public key is not a secret) and uploaded. Without that variable the job uploads nothing
# and the summary says why; the deterministic rows still run and still block (section 4.6).
#
# Least privilege (SA-R6): this job holds contents: read and no other token, and no secret.
# The scanners (nmap, testssl.sh and ZAP, pinned by digest in deploy/security/compose.yml)
# run in containers that reach only the node under test, so a compromised image reads the
# binary it tests and nothing else; the round does not pass GH_TOKEN to the scripts or the
# containers. ZAP, which scans the web interface and the API in the web group (run last,
# after the net, tls, unit and fuzz groups, in this same job), gets a read-only viewer
# session and token of the throwaway node, which the round revokes at the end of the group.
# Every `uses:` is pinned to a full commit SHA with its tag in a comment, the same commits
# ci.yml and release.yml use for the same actions.
name: Security round

on:
  workflow_call:
    inputs:
      version:
        description: "The version being released, for example 0.0.11"
        required: true
        type: string
      commit:
        description: "The commit the release is built from"
        required: true
        type: string
      binary-artifact:
        description: "The name of the Linux binary artifact of this run"
        required: false
        type: string
        default: binary-linux-x86_64
      rows:
        description: "Row groups to run (space separated); empty: every deterministic row"
        required: false
        type: string
        default: "net tls unit fuzz web"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to run the round against, for example v0.0.10"
        required: true
        type: string
      rows:
        description: "Row groups to run (space separated)"
        required: false
        type: string
        default: "net tls unit fuzz web"

permissions:
  contents: read

concurrency:
  # `inputs.tag` is set only on a direct dispatch; a call from release.yml passes the version.
  group: security-round-${{ inputs.tag != '' && inputs.tag || inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The age release the job runs (pinned by version and SHA-256, as release.yml pins its SBOM
  # tools). Only the encryption of the bundle uses it.
  AGE_VERSION: 1.3.2
  AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10

jobs:
  security:
    name: Security round
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      ROWS: ${{ inputs.rows }}
      AGE_RECIPIENT: ${{ vars.SECURITY_AGE_RECIPIENT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The round's scripts (deploy/security/) are those of this workflow's own commit,
          # whatever is tested: a tag from before the scripts existed must still run.
          ref: ${{ github.sha }}
          persist-credentials: false

      # The in-process fuzz targets (fuzz.targets) must be those of the source the tested
      # binary was built from, so a dispatch gets the tag's tree beside the scripts. On a
      # release call the workspace itself is that source.
      - name: The source of the tag under test (dispatch)
        if: inputs.tag != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          persist-credentials: false

      # The binary under test. On a release call it is the artifact of this run; on a dispatch
      # it is the published asset, checked against the release's SHA256SUMS before it is run.
      - name: The binary under test (release call)
        if: inputs.tag == ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ inputs.binary-artifact }}
          path: bin
      - name: The binary under test (dispatch; verified against SHA256SUMS)
        if: inputs.tag != ''
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p bin
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "tenko-${version}-linux-x86_64" --pattern SHA256SUMS --dir bin
          (cd bin && grep " tenko-${version}-linux-x86_64\$" SHA256SUMS | sha256sum --check --strict -)
          # The round reads VERSION from the binary; align it with the tag.
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Name and mark the binary
        run: |
          set -euo pipefail
          bin="$(find bin -name 'tenko-*-linux-x86_64' -type f | head -n 1)"
          test -n "$bin"
          chmod +x "$bin"
          echo "BINARY=$PWD/$bin" >> "$GITHUB_ENV"

      # age, for encrypting the evidence bundle. Downloaded by version and checked against the
      # pinned SHA-256; no third-party action.
      - name: Install age
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/age"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSL -o age.tar.gz \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  age.tar.gz" | sha256sum --check --strict -
          tar -xzf age.tar.gz
          echo "$tools/age" >> "$GITHUB_PATH"

      - name: Corpus cache for the fuzz rows
        if: contains(inputs.rows, 'fuzz')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # The fuzz row writes its corpus under the source it tests (see SOURCE below).
          path: ${{ inputs.tag != '' && 'release-source/fuzz/corpus' || 'fuzz/corpus' }}
          key: security-fuzz-corpus-${{ inputs.version || inputs.tag }}
          restore-keys: |
            security-fuzz-corpus-

      # The fuzz rows need a nightly toolchain and cargo-fuzz; the deterministic rows do not.
      - name: Rust nightly and cargo-fuzz
        if: contains(inputs.rows, 'fuzz')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        if: contains(inputs.rows, 'fuzz')
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-fuzz

      - name: Run the round
        run: |
          set -euo pipefail
          export BUNDLE="$RUNNER_TEMP/evidence.tar.gz"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          # The round prints the row lines to its standard output; capture them for the summary.
          # On a dispatch the fuzz targets are those of the tag's tree (checked out beside the
          # scripts); on a release call SOURCE stays unset and the workspace is the source.
          if [ -n "$TAG" ]; then
            export SOURCE="$GITHUB_WORKSPACE/release-source"
          fi
          rc=0
          sudo --preserve-env=BINARY,ROWS,BUNDLE,VERSION,SOURCE \
            env "PATH=$PATH" "TENKO_UI_STUB=1" \
            bash deploy/security/round.sh | tee "$RUNNER_TEMP/rows.txt" || rc=$?
          echo "ROUND_RC=$rc" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: The rows in the job summary
        if: always()
        run: |
          {
            echo "### Security round, Tenko ${VERSION:-${TAG}}"
            echo
            echo '```'
            sed -nE 's/^(PASS|FAIL|SKIP|rows:) .*/&/p' "$RUNNER_TEMP/rows.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt and upload the evidence
        if: always()
        id: evidence
        run: |
          set -euo pipefail
          if [ -z "${AGE_RECIPIENT:-}" ]; then
            {
              echo
              echo "**No evidence was uploaded.** The repository variable \`SECURITY_AGE_RECIPIENT\`"
              echo "is not set, so the round cannot encrypt its bundle to the owner's key. On a"
              echo "public repository the artifacts are public (section 4.6 of the plan), so the"
              echo "round refuses to upload unencrypted evidence. Set the variable (SA0) and run"
              echo "again. The deterministic rows above still ran and still block the release."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$BUNDLE" ]; then
            echo "::warning::the round produced no evidence bundle"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/evidence.tar.gz.age" "$BUNDLE"
          sha="$(sha256sum "$RUNNER_TEMP/evidence.tar.gz.age" | cut -d' ' -f1)"
          echo "Encrypted bundle sha256: $sha" >> "$GITHUB_STEP_SUMMARY"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - name: Upload the encrypted evidence
        if: always() && steps.evidence.outputs.uploaded == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-evidence-${{ env.VERSION }}
          path: ${{ runner.temp }}/evidence.tar.gz.age
          if-no-files-found: warn
          retention-days: 90

      - name: Fail when a blocking row failed
        if: always()
        run: |
          set -euo pipefail
          # The round exits non-zero when a blocking row failed; honour that here so the
          # release stops (SA-Q1 (b)).
          test "${ROUND_RC:-1}" = 0
