# Configuration of zizmor, the linter of the workflows (check L1.6 of
# docs/plans/security-audit-plan.md; the job `workflow-lint` of ci.yml). Findings of High
# severity fail the job; everything else is reported in its summary.
#
# A finding is suppressed here, never with a comment in the workflow, and every suppression
# carries its reason and, when it is temporary, what removes it. Prefer the narrowest form:
# `<file>:<line>` for one place, a whole file only when the reason covers all of it.
# CONTRIBUTING.md, "Continuous integration", has the procedure.

rules: {}
