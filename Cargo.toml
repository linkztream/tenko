[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes under bench/ and the cargo-fuzz crate under fuzz/ are standalone packages.
# Cargo matches `exclude` entries as path prefixes, not globs.
exclude = ["bench", "fuzz"]

[workspace.package]
edition = "2024"
# The oldest toolchain that builds every declared dependency (redb 4.3 needs 1.90, uuid 1.27
# needs 1.89, utoipa 6 and time 0.3.55 need 1.88).
rust-version = "1.90"
# Placeholder until the project licence is decided (open question in docs/ROADMAP.md).
license = "LicenseRef-Proprietary"

# Debug information is opt-in. Development and test builds carry line tables for the workspace
# crates (file and line in backtraces) and none for dependencies; the Windows PDB files of the
# test binaries otherwise reach half a gigabyte each and fill the build disk. Full information
# for a debugger session: `cargo test --profile dev-full` (output under target/dev-full).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev-full]
inherits = "dev"
debug = 2

[profile.dev-full.package."*"]
debug = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Only the lead builder edits this file (docs/plans/phase-1-execution.md, section 3). Every
# Slice 1 dependency is declared here up front; a crate opts in with `name.workspace = true`.
# Declarations that no crate uses do not enter Cargo.lock, so `cargo deny` and `cargo audit`
# still see the real graph.
[workspace.dependencies]
# Internal crates.
tenko-api = { path = "crates/tenko-api" }
tenko-auth = { path = "crates/tenko-auth" }
tenko-cluster = { path = "crates/tenko-cluster" }
tenko-connect = { path = "crates/tenko-connect" }
tenko-connect-hass = { path = "crates/tenko-connect-hass" }
tenko-connect-proxmox = { path = "crates/tenko-connect-proxmox" }
tenko-connect-unifi = { path = "crates/tenko-connect-unifi" }
tenko-scan = { path = "crates/tenko-scan" }
tenko-core = { path = "crates/tenko-core" }
tenko-dns = { path = "crates/tenko-dns" }
tenko-ipam = { path = "crates/tenko-ipam" }
tenko-jobs = { path = "crates/tenko-jobs" }
tenko-migrate = { path = "crates/tenko-migrate" }
tenko-store = { path = "crates/tenko-store" }
tenko-vault = { path = "crates/tenko-vault" }

# Store and encoding.
arc-swap = "1.9.2"
bytes = { version = "1.12.1", features = ["serde"] }
ciborium = "0.2.2"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2", "generic-snapshot-data"] }
redb = "=4.3.0"
sha2 = "0.11.0"

# DNS (Phase 2, ADR 0017): the wire format behind the `Codec` trait of `tenko-dns`, pinned
# exactly after the WP4.0 evaluation (risk R38); `std` only, no `tsig` (it pulls ring).
domain = { version = "=0.12.3", default-features = false, features = ["std"] }
# The differential tests of the DNS codec (ADR 0009); a dev-dependency only, never shipped.
hickory-proto = "0.26.3"
# The counting global allocator of the DNS allocation test.
stats_alloc = "0.1.10"

# Domain types.
ipnet = { version = "2.12.2", features = ["serde"] }
macaddr = { version = "1.0.1", features = ["serde_std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.27.0", features = ["v7", "serde"] }

# Import and export (WP1.5).
calamine = "0.36.1"
# Writers for the import test fixtures (workbooks and their archives); tests only.
rust_xlsxwriter = "0.99.1"
zip = { version = "8.6.0", default-features = false }

# Connector plugin protocol (WP2.0): protobuf and gRPC, compiled at build time without protoc.
prost = "0.14.4"
prost-types = "0.14.4"
quick-xml = "0.41"
# `tls-aws-lc` and `tls-native-roots`: the OTLP exporter of the traces reaches an `https://`
# collector over rustls with aws-lc-rs and the system roots (WP3.5c); ring and OpenSSL stay out.
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "router", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6", default-features = false, features = ["transport"] }
protox = "0.10.0"
csv = "1.4.0"
encoding_rs = "0.8.42"

# Async runtime and plumbing.
async-trait = "0.1.92"
futures = "0.3.34"
tokio = { version = "1.53.2", features = ["full"] }
# `CancellationToken` of the leader-only services (Slice 3, WP3.0); already in the graph
# through tonic and h2.
tokio-util = { version = "0.7.20", default-features = false }

# HTTP API and OpenAPI.
axum = "0.8.9"
tower = "0.5.3"
tower-http = "0.7.1"
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
utoipa-axum = "0.3.0"

# Cryptography. rustls uses the aws-lc-rs provider; OpenSSL is banned in deny.toml.
argon2 = { version = "0.6.0", features = ["zeroize"] }
# prebuilt-nasm: aws-lc-sys otherwise needs NASM on the Windows build machine and in CI.
aws-lc-rs = { version = "1.18.1", features = ["prebuilt-nasm"] }
# HTTP client for connectors, the online HIBP check and the CLI (rustls, no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
# Unicode NFKC normalization of passwords before hashing (NIST SP 800-63B).
unicode-normalization = "0.1"
# Custom password preset (IAM-03): operator-supplied pattern.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rustls = "0.23.45"
zeroize = "1.9.1"

# Errors, logging and the command line.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Traces (WP3.5c): OpenTelemetry over OTLP/gRPC on the tonic of the graph, off by default.
# The SDK and the exporter are dependencies of `tenko` only; the crates that carry the trace
# context between processes use the API and the bridge.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace", "tls-aws-lc", "tls-roots"] }
opentelemetry-proto = { version = "0.33.1", default-features = false }
opentelemetry-semantic-conventions = "0.33.1"
tracing-opentelemetry = { version = "0.34.0", default-features = false }

# Tests only.
proptest = "1.11.0"
tempfile = "3.27.0"
