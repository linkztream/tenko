[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes under bench/ and the cargo-fuzz crate under fuzz/ are standalone packages.
# Cargo matches `exclude` entries as path prefixes, not globs.
exclude = ["bench", "fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
# Placeholder until the project licence is decided (see docs/adr/).
license = "LicenseRef-Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# Internal crates.
ddi-core = { path = "crates/ddi-core" }

# External crates. Only dependencies that a crate actually uses are listed here, so that
# `cargo deny` and `cargo audit` see the real graph.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Planned dependencies, added by the first crate that needs them:
#   axum, tower, tower-http       HTTP API (ddi-api)
#   utoipa                        OpenAPI schema for public API types
#   uuid (v7, serde)              identifiers (ddi-core)
#   time (serde, formatting)      timestamps (ddi-core)
#   bytes                         wire buffers (ddi-dns, ddi-dhcp)
#   ipnet, macaddr                address and prefix types (ddi-core, ddi-ipam)
#   include_dir                   embedding ui/dist (ddi-api)
#   Raft implementation and embedded KV engine: decided by spikes, see docs/adr/
