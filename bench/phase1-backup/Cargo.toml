[package]
name = "phase1-backup"
version = "0.1.0"
edition = "2024"
publish = false
description = "Phase 1 backup benchmark (M14): create, verify and restore of a backup of the M6 data set"

[workspace]

[dependencies]
tenko = { path = "../../crates/tenko", default-features = false }
tenko-store = { path = "../../crates/tenko-store", features = ["raft", "testing"] }
tenko-core = { path = "../../crates/tenko-core" }
tenko-vault = { path = "../../crates/tenko-vault" }
bytes = { version = "1.12.1", features = ["serde"] }
tokio = { version = "1.53.2", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
anyhow = "1.0.104"
zeroize = "1.9.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
debug = 1
