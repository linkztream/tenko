[package]
name = "phase1-rbac"
version = "0.1.0"
edition = "2024"
publish = false
description = "Phase 1 access-control benchmarks (M13): the cost of scope filtering on lists and on server-sent events"

[workspace]

[dependencies]
tenko-core = { path = "../../crates/tenko-core" }
tenko-store = { path = "../../crates/tenko-store", features = ["raft", "testing"] }
tenko-auth = { path = "../../crates/tenko-auth", features = ["testing"] }
tenko-vault = { path = "../../crates/tenko-vault", features = ["testing"] }
tenko-ipam = { path = "../../crates/tenko-ipam" }
tenko-jobs = { path = "../../crates/tenko-jobs" }
tenko-api = { path = "../../crates/tenko-api" }
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
futures = "0.3.34"
bytes = { version = "1.12.1", features = ["serde"] }
tokio = { version = "1.53.2", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
anyhow = "1.0.104"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
debug = 1
