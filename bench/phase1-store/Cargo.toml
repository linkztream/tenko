[package]
name = "phase1-store"
version = "0.1.0"
edition = "2024"
publish = false
description = "Phase 1 store benchmarks (M1, M2, M5, M6, M10): the openraft-over-redb store on a Windows workstation"

[workspace]

[dependencies]
tenko-store = { path = "../../crates/tenko-store", features = ["raft", "testing"] }
tenko-core = { path = "../../crates/tenko-core" }
arc-swap = "1.9.2"
bytes = { version = "1.12.1", features = ["serde"] }
tokio = { version = "1.53.2", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
hdrhistogram = "7.6.0"
anyhow = "1.0.104"
redb = "=4.3.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
debug = 1
