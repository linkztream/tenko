[package]
name = "phase2-dns"
version = "0.1.0"
edition = "2024"
publish = false
description = "Phase 2 DNS bench harness: load generator, zone file generator and result report for any DNS server"
license = "Apache-2.0"

# Standalone crate: not part of the main workspace.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hdrhistogram = "7.6.0"
humantime = "2.4.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
sysinfo = "0.39.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"
