[package]
name = "spike-b-udp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike B: raw UDP DNS throughput and DNS wire-format crate comparison"
license = "Apache-2.0"

# Standalone crate: not part of the main workspace.
[workspace]

[features]
default = ["backend-domain", "backend-hickory"]
backend-domain = ["dep:domain"]
backend-hickory = ["dep:hickory-proto"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
domain = { version = "0.12.3", optional = true }
hdrhistogram = "7.6.0"
hickory-proto = { version = "0.26.3", optional = true }
humantime = "2.4.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
sysinfo = "0.39.6"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.8.2"
stats_alloc = "0.1.10"

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
debug = false
lto = "fat"
codegen-units = 1

[[bench]]
name = "codec"
harness = false
