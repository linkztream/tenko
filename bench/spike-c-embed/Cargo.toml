[package]
name = "spike-c-embed"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike C: SPA embedded in the server binary, served by the API process, live updates over SSE"
license = "Apache-2.0"
build = "build.rs"

# Standalone crate: not part of the main workspace.
[workspace]

[features]
default = ["backend-include-dir", "precompressed"]
# Exactly one embedding backend is used. If several are enabled the priority is
# codegen > rust-embed > include_dir.
backend-include-dir = ["dep:include_dir"]
backend-rust-embed = ["dep:rust-embed"]
# rust-embed's own compression: deflate in the binary, inflated at runtime on first access.
rust-embed-compression = ["backend-rust-embed", "rust-embed/compression"]
# build.rs emits a static table with include_bytes!, no embedding crate.
backend-codegen = []
# build.rs writes brotli and gzip variants of text assets next to the originals.
precompressed = []
# tower-http CompressionLayer compresses responses at request time.
runtime-compression = ["tower-http/compression-br", "tower-http/compression-gzip"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
include_dir = { version = "0.7.4", optional = true }
rust-embed = { version = "8.13.0", optional = true, features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

# Used only by the `measure` binary (not linked into the server binary).
brotli = "9.0.0"
flate2 = "1.1.10"
hdrhistogram = "7.6.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
sysinfo = "0.39.6"

[build-dependencies]
brotli = "9.0.0"
flate2 = "1.1.10"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"
