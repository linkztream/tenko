# A type or method that only a home of shared code may use (CONTRIBUTING.md, "Where shared
# code lives") goes into `disallowed-types` or `disallowed-methods` here, with a `reason` that
# names the home; the home's module carries `#[allow(clippy::disallowed_methods)]` (or
# `_types`) with a comment that says why. An entry is added by the change that moves the last
# copy into its home, so that the workspace passes the ban the day it lands.
cognitive-complexity-threshold = 20
too-many-arguments-threshold = 8
# The marked sign-in batches belong to tenko-auth's sign-in code (and the store's own tests).
disallowed-methods = [
  { path = "tenko_store::api::WriteBatch::completed_sign_in", reason = "only tenko-auth's sign-in code marks a batch as a sign-in's writes" },
  { path = "tenko_store::api::WriteBatch::failed_sign_in", reason = "only tenko-auth's sign-in code marks a batch as a sign-in's writes" },
]
# Domain terms that `clippy::doc_markdown` would otherwise ask to wrap in backticks.
# ".." keeps the default list.
doc-valid-idents = [
  "DHCPv4",
  "DHCPv6",
  "SNMPv2c",
  "SNMPv3",
  "OpenAPI",
  "SolidJS",
  "UniFi",
  "PowerShell",
  "WebAuthn",
  "UUIDv7",
  "RRset",
  "RRsets",
  "DNSKEY",
  "NSEC3PARAM",
  "DoT",
  "DoH",
  "XoT",
  "IoT",
  "..",
]
