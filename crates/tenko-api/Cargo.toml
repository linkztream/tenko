[package]
name = "tenko-api"
version = "0.0.2"
description = "HTTP API (axum), OpenAPI document, server-sent events, embedded UI and the API client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
default = ["server"]
# The HTTP server: router, middleware, listener and TLS, server-sent events and the embedded
# web UI.
server = [
  "dep:arc-swap",
  "dep:aws-lc-rs",
  "dep:axum",
  "dep:futures",
  "dep:hyper",
  "dep:hyper-util",
  "dep:ipnet",
  "dep:rustls",
  "dep:sha2",
  "dep:tenko-auth",
  "dep:tenko-cluster",
  "dep:tenko-connect",
  "dep:tenko-dns",
  "dep:tenko-ipam",
  "dep:tenko-jobs",
  "dep:tenko-scan",
  "dep:tenko-store",
  "dep:tenko-vault",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:tower",
  "dep:tower-http",
  "dep:tracing",
  "dep:utoipa-axum",
]
# The API client of the command line (API-03): the DTOs and a reqwest client over rustls,
# without axum.
client = ["dep:reqwest"]

[dependencies]
bytes = { workspace = true }
# XLIFF language packs (src/i18n); outside the server feature for the fuzz target.
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tenko-core = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

# Server.
arc-swap = { workspace = true, optional = true }
# The keyed fingerprints of the idempotency middleware (HMAC-SHA-256, random key).
aws-lc-rs = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["http2"] }
futures = { workspace = true, optional = true }
hyper = { version = "1.12.0", optional = true, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", optional = true, features = ["http1", "http2", "server", "server-auto", "server-graceful", "service", "tokio"] }
ipnet = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tenko-auth = { workspace = true, optional = true }
tenko-cluster = { workspace = true, optional = true }
tenko-connect = { workspace = true, optional = true }
# The zone service of the DNS routes (WP4.2).
tenko-dns = { workspace = true, optional = true }
tenko-vault = { workspace = true, optional = true }
tenko-ipam = { workspace = true, optional = true }
tenko-jobs = { workspace = true, optional = true }
tenko-scan = { workspace = true, optional = true }
tenko-store = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tower = { workspace = true, optional = true, features = ["util"] }
tower-http = { workspace = true, optional = true, features = ["fs", "set-header"] }
tracing = { workspace = true, optional = true }
utoipa-axum = { workspace = true, optional = true }

# Client.
reqwest = { workspace = true, optional = true }

[build-dependencies]
brotli = "9.0.0"
flate2 = "1.1.10"
sha2 = { workspace = true }

[dev-dependencies]
tenko-vault = { workspace = true, features = ["testing"] }
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
tenko-api = { path = ".", features = ["client"] }
tenko-auth = { workspace = true, features = ["testing"] }
tenko-store = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
