[package]
name = "tenko-auth"
version = "0.0.2"
description = "Local authentication, password policy presets, TOTP, passkeys, sessions, personal tokens, roles and security settings"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The online HIBP range source over HTTPS (IAM-04). Without it, the breached-password check
# uses the offline filter or a range source supplied by the caller.
online = ["dep:reqwest"]
# Test helpers for other packages: a mock clock, an in-memory vault and a software
# authenticator that produces WebAuthn registration and assertion responses.
testing = ["tenko-vault/testing"]

[dependencies]
arc-swap = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
# The change stream of the store (the unlock watch).
futures = { workspace = true }
# Unicode classes (`\p{L}`) in Custom presets, whatever other crates enable.
regex = { workspace = true, features = ["unicode"] }
reqwest = { workspace = true, optional = true }
# The TLS transport of the audit export (RFC 5425): already in the graph through
# tenko-api and tenko-cluster, with the same features.
rustls = { workspace = true }
rustls-native-certs = "0.8.4"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tenko-core = { workspace = true }
tenko-store = { workspace = true }
tenko-vault = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# `CancellationToken` of the audit export's leader service.
tokio-util = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# A test certificate authority for the TLS sink (already in the graph through tenko-api).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
tempfile = { workspace = true }
tenko-auth = { path = ".", features = ["testing"] }
# The production store, for the scope matrix that runs against both stores.
tenko-store = { workspace = true, features = ["raft", "testing"] }
tokio = { workspace = true }

[lints]
workspace = true
