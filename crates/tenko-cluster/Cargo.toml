[package]
name = "tenko-cluster"
version = "0.0.8"
description = "Node-to-node gRPC over mutual TLS, enrolment and the internal CA"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
# The compressed configuration snapshot of the node sync (deflate).
flate2 = "1.1.10"
futures = { workspace = true }
# The client side of the node transport: a TLS stream as a hyper connection (same version
# and features as tenko-connect).
hyper-util = { version = "0.1.21", features = ["tokio"] }
ipnet = { workspace = true }
# The W3C trace context of the controller-to-controller calls (WP3.5c): the propagator API
# and the span context of the `tracing` bridge.
opentelemetry = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
# X.509 generation for the internal CA, on the same aws-lc-rs backend as rustls.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser", "zeroize"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tenko-core = { workspace = true }
tenko-jobs = { workspace = true }
tenko-store = { workspace = true, features = ["raft"] }
tenko-vault = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# The cancellation token of leader-only services (`tenko_core::cluster::LeaderService`).
tokio-util = { workspace = true }
# Mutual TLS of the node transport (same version and features as tenko-api).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
# Reads validity, names and extensions of certificates; verifies CSR signatures.
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
zeroize = { workspace = true }

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
# The in-memory span exporter of the trace context tests.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tenko-jobs = { workspace = true, features = ["testing"] }
tenko-store = { workspace = true, features = ["testing"] }
tenko-vault = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
