[package]
name = "tenko-connect-unifi"
version = "0.0.10"
description = "UniFi Network reference plugin (network controller)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tenko-plugin-unifi"
path = "src/bin/tenko-plugin-unifi.rs"

[dependencies]
async-trait = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tenko-connect = { workspace = true }
tenko-core = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }

[lints]
workspace = true
