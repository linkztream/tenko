[package]
name = "tenko-connect"
version = "0.0.8"
description = "Connector plugin SDK: protocol, host runner, helper library, manifest and conformance suite"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
default = ["http-client"]
# `MockInventorySource` and other test doubles for crates that use connectors.
testing = []
# `sdk::http`: the web-API client of plugins (TLS modes, error mapping, bounded reads).
http-client = ["dep:reqwest", "dep:rustls"]

[dependencies]
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ipnet = { workspace = true }
# The W3C trace context the host puts on its calls to plugins (WP3.5c): the propagator API
# and the span context of the `tracing` bridge.
opentelemetry = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tenko-core = { workspace = true }
tenko-jobs = { workspace = true }
tenko-store = { workspace = true }
tenko-vault = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
# The in-memory span exporter of the trace context tests.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# A test certificate authority and a TLS server for the `sdk::http` tests (both already in the
# graph through tenko-api and tenko-cluster, with the same features).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
tempfile = { workspace = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tenko-jobs = { workspace = true, features = ["testing"] }
tenko-store = { workspace = true, features = ["testing"] }
tenko-vault = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
