[package]
name = "tenko-connect"
version = "0.0.1"
description = "Connector plugin SDK: protocol, host runner, helper library, manifest and conformance suite"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
# `MockInventorySource` and other test doubles for crates that use connectors.
testing = []

[dependencies]
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ipnet = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tenko-core = { workspace = true }
tenko-jobs = { workspace = true }
tenko-store = { workspace = true }
tenko-vault = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tenko-jobs = { workspace = true, features = ["testing"] }
tenko-store = { workspace = true, features = ["testing"] }
tenko-vault = { workspace = true, features = ["testing"] }

[lints]
workspace = true
