[package]
name = "tenko-dhcp"
version = "0.0.3"
description = "DHCPv4 and DHCPv6, failover, relay handling, dynamic DNS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# WP7.0: the model, the IPAM rows the image derives from, and the feed's channel.
ipnet = { workspace = true }
# WP7.3: the listeners' sockets (SO_REUSEPORT per worker on Linux, SO_BINDTODEVICE in direct
# mode, SO_BROADCAST), the safe socket API the DNS role uses; already in the graph.
socket2 = { workspace = true }
tenko-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# WP7.2: the lease store on the replicated store, its committer, and the leader services
# of expiry and history retention.
async-trait = { workspace = true }
futures = { workspace = true }
tenko-store = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# WP7.4: the configuration service (src/config) writes its rows through inline jobs on the
# store and reads the IPAM rows a scope derives from; every crate is already in the graph.
serde = { workspace = true }
tenko-ipam = { workspace = true }
tenko-jobs = { workspace = true }
uuid = { workspace = true }
# WP7.5: the in-process feed queues the stored bytes of changed rows (as the DNS feed does),
# and the node commands take their arguments as CBOR; both crates are in the graph.
bytes = { workspace = true }
# WP8.5: the conflict probe borrows the probe role's pinger and raw ARP link (plan section
# 2.7, P3-Q7); an internal crate already in the graph through tenko.
tenko-scan = { workspace = true }
# WP8.3: DDNS writes its change sets through the zone service of `tenko-dns` (ADR 0020)
# and computes the DHCID with SHA-256 (RFC 4701); both crates are already in the graph.
sha2 = { workspace = true }
tenko-dns = { workspace = true }
# WP9.3: the Kea export writes Kea's JSON configuration (MIG-16); already in the graph.
serde_json = { workspace = true }

# WP7.5: the link-layer reply of direct mode (AF_PACKET), through the safe API the scanner's
# raw methods use (WP3.14); Linux only, MIT OR Apache-2.0, already in the graph.
[target.'cfg(target_os = "linux")'.dependencies]
pnet_datalink = "0.35.0"

[dev-dependencies]
# The counting allocator of tests/alloc.rs (the DNS codec's allocation test).
stats_alloc = { workspace = true }
# WP7.0: the differential test of the DHCPv4 codec (ADR 0019 point 7); never shipped.
dhcproto = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true }
# WP7.2: the lease tests on the Raft store with its write-refusal hook, in temporary
# directories.
tempfile = { workspace = true }
tenko-store = { workspace = true, features = ["raft", "testing", "test-hooks"] }

[lints]
workspace = true
