[package]
name = "tenko-dns"
version = "0.0.3"
description = "DNS engine contracts: the wire codec, the zone feed, the index, the resolver and the policy, rate, upstream and log traits"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
arc-swap = { workspace = true }
# The zone service (src/zone): the inline jobs of every write and the TSIG secrets.
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bytes = { workspace = true }
# `zonefile` adds the zone file scanner (`domain::zonefile::inplace`) for the import; it
# brings no crate the workspace does not already build (`bytes`, `serde`).
domain = { workspace = true, features = ["zonefile"] }
# Block list versions above 64 KiB of entries are deflated (src/lists); the version
# tenko-api and tenko-cluster already build.
flate2 = "1.1.10"
# The store's change streams (WP6.1: the transfer path, NOTIFY out and the secondary
# service follow the zones; WP6.3: the signer); already in the graph through tenko-store.
futures = { workspace = true }
# DoH upstreams (WP5.1): HTTP/2 over the rustls stream; both crates are already in the
# graph through hyper and tonic.
h2 = "0.4.20"
http = "1.5.0"
# DNS over HTTPS served to clients (src/tls, WP5.3): HTTP/1.1 and HTTP/2 on hyper with the
# features and versions tenko-api already builds.
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server", "server-auto", "tokio"] }
ipnet = { workspace = true }
# DNS over TLS and HTTPS served to clients (src/tls): the rustls server over the process's
# certificate resolver, same version and features as tenko-api and tenko-cluster.
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# DoT and DoH upstreams (WP5.1): the same rustls with aws-lc-rs and the system roots.
rustls-native-certs = "0.8.4"
socket2 = { workspace = true }
tenko-core = { workspace = true }
tenko-jobs = { workspace = true }
tenko-store = { workspace = true }
tenko-vault = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hickory-proto = { workspace = true }
# The DoH client of tests/tls*.rs (HTTP/2 and HTTP/1.1 over a rustls client).
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
# An independent protobuf decoder for the dnstap test (already built through tonic).
prost = { workspace = true }
proptest = { workspace = true }
# The certificates of the in-test DoT and DoH upstreams and the test CA and leaves of tests/tls*.rs.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
stats_alloc = { workspace = true }
tenko-core = { workspace = true, features = ["testing"] }
# The TLS service of the process (imported files with hot reload) in tests/tls*.rs.
tenko-cluster = { workspace = true }
tenko-jobs = { workspace = true, features = ["testing"] }
tenko-vault = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
time = { workspace = true }

[lints]
workspace = true
