[package]
name = "tenko-dns"
version = "0.0.1"
description = "DNS engine contracts: the wire codec, the zone feed, the index, the resolver and the policy, rate, upstream and log traits"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
arc-swap = { workspace = true }
# The zone service (src/zone): the inline jobs of every write and the TSIG secrets.
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bytes = { workspace = true }
# `zonefile` adds the zone file scanner (`domain::zonefile::inplace`) for the import; it
# brings no crate the workspace does not already build (`bytes`, `serde`).
domain = { workspace = true, features = ["zonefile"] }
# DoH upstreams (WP5.1): HTTP/2 over the rustls stream; both crates are already in the
# graph through hyper and tonic.
h2 = "0.4.20"
http = "1.5.0"
ipnet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# DoT and DoH upstreams (WP5.1): rustls with aws-lc-rs and the system roots, as the rest
# of the process.
rustls = { workspace = true }
rustls-native-certs = "0.8.4"
socket2 = { workspace = true }
tenko-core = { workspace = true }
tenko-jobs = { workspace = true }
tenko-store = { workspace = true }
tenko-vault = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hickory-proto = { workspace = true }
proptest = { workspace = true }
# The certificates of the in-test DoT and DoH upstreams.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
stats_alloc = { workspace = true }
tenko-core = { workspace = true, features = ["testing"] }
tenko-jobs = { workspace = true, features = ["testing"] }
tenko-vault = { workspace = true, features = ["testing"] }
time = { workspace = true }

[lints]
workspace = true
