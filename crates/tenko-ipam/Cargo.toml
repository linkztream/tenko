tenko-core = { workspace = true }
tenko-jobs = { workspace = true }
tenko-store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tenko-core = { workspace = true, features = ["testing"] }
tenko-jobs = { workspace = true, features = ["testing"] }

[lints]
workspace = true
