[package]
name = "tenko-jobs"
version = "0.0.9"
description = "Job engine: steps, state, timeouts, rollback"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Test support for this and other packages (`tenko_jobs::testing`): an engine on a
# `MemStore` with a mock clock and scripted step handlers.
testing = []

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }
tenko-core = { workspace = true }
tenko-store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# `CancellationToken` of the leader-only service `jobs.runner`.
tokio-util = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The in-process cluster of Raft stores for the leader-only runner tests.
tenko-store = { workspace = true, features = ["raft", "testing"] }
# Enables the test support for this package's own integration tests.
tenko-jobs = { path = ".", features = ["testing"] }

[lints]
workspace = true
