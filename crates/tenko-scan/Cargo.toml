[package]
name = "tenko-scan"
version = "0.0.7"
description = "Probe role: passive and active discovery, SNMP polling"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = { workspace = true }
# SNMPv3 user-based security: HMAC-SHA-1 and HMAC-SHA-2, AES-128-CFB (RFC 3414, RFC 3826,
# RFC 7860).
aws-lc-rs = { workspace = true }
# DNS wire format for mDNS, LLMNR and reverse DNS (ADR 0009); BSD-3-Clause.
domain = { version = "0.12.3", default-features = false, features = ["std"] }
futures = { workspace = true }
ipnet = { workspace = true }
# Blackout windows in a named time zone with daylight saving time; Unlicense OR MIT.
jiff = "0.2.38"
serde = { workspace = true }
serde_json = { workspace = true }
# Unprivileged ICMP datagram sockets on Linux and multicast listeners with address reuse;
# MIT OR Apache-2.0.
socket2 = { version = "0.6.5", features = ["all"] }
tenko-cluster = { workspace = true }
tenko-core = { workspace = true }
tenko-ipam = { workspace = true }
tenko-jobs = { workspace = true }
tenko-store = { workspace = true }
tenko-vault = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# Raw link-layer sockets for the raw-socket methods (WP3.14): sending ARP requests and TCP
# SYN segments and listening for ARP replies, LLDP, CDP and DHCP frames, through a safe API
# (AF_PACKET on Linux). Linux only: these methods answer `unsupported` on Windows, which
# needs Npcap that Tenko does not bundle. MIT OR Apache-2.0, accepted by `cargo deny`.
[target.'cfg(target_os = "linux")'.dependencies]
pnet_datalink = "0.35.0"

[dev-dependencies]
tenko-jobs = { workspace = true, features = ["testing"] }
tenko-store = { workspace = true, features = ["testing"] }
tenko-vault = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
