[package]
name = "tenko"
version = "0.0.1"
description = "The Tenko DDI binary: the server roles and the command-line client in one executable"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tenko"
path = "src/main.rs"

[features]
default = ["import"]
# The import service of WP1.5 (`tenko_ipam::import`): staged uploads, preview and apply
# jobs behind `/api/v1/imports`. Without it those routes answer 503 `import.unavailable`.
import = []
# Signature verification of release files (API-19). Off until the release signing of API-19
# exists: with it on, every install refuses a release whose signature cannot be checked.
release-signatures = []

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
ipnet = { workspace = true }
openraft = { workspace = true }
# Traces over OTLP (WP3.5c): the SDK, the gRPC exporter and the bridge from `tracing`, used
# only when `[telemetry] otlp_endpoint` is set.
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tenko-api = { workspace = true, features = ["client"] }
tenko-auth = { workspace = true, features = ["online"] }
tenko-cluster = { workspace = true }
tenko-connect = { workspace = true }
tenko-connect-hass = { workspace = true }
tenko-connect-proxmox = { workspace = true }
tenko-connect-unifi = { workspace = true }
tenko-core = { workspace = true }
tenko-ipam = { workspace = true }
tenko-jobs = { workspace = true }
tenko-scan = { workspace = true }
tenko-store = { workspace = true, features = ["raft"] }
tenko-vault = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# The TLS settings of the OTLP exporter (`https://` collectors with the system roots).
tonic = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
uuid = { workspace = true }
zeroize = { workspace = true }
# Not declared in the workspace: the `tenko.toml` parser and the no-echo password prompt of
# `tenko login` and `tenko setup` (both MIT or Apache-2.0).
rpassword = "7.5.4"
toml = "1.1.8"
# The free space of the data directory's file system before a pre-migration copy (MIT or
# Apache-2.0; rustix and windows-sys, both already in the graph).
fs4 = "1.1.0"

[target.'cfg(windows)'.dependencies]
# Service Control Manager integration (OPS-10); the FFI lives inside the crate.
windows-service = "0.8.1"
# The Application Event Log sink of the service (OPS-10, R31); the FFI lives inside the
# crate (MIT).
tracing-layer-win-eventlog = "1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# `sd_notify` readiness and stop notifications for `Type=notify` units (OPS-13).
sd-notify = "0.5.0"

[dev-dependencies]
# The OTLP receiver of the trace tests (`tests/serve_support/otlp.rs`), on loopback.
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace"] }
# The imported-certificate transport of `tests/serve_support` (a test CA and a leaf for
# `localhost`).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
tempfile = { workspace = true }
# The software authenticator of the passkey acceptance tests.
tenko-auth = { workspace = true, features = ["online", "testing"] }
# The in-process cluster fixtures and the memory vault of the leader supervisor tests.
tenko-store = { workspace = true, features = ["raft", "testing"] }
tenko-vault = { workspace = true, features = ["testing"] }

[lints]
workspace = true
