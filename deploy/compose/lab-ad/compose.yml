# The Active Directory lab (identity plan section 3.19): a Samba AD domain controller
# provisioned without its own DNS, a Linux client with MIT Kerberos, and one Tenko node that
# serves the domain's zones and takes the controller's and the client's secure dynamic
# updates. A lab, not a deployment: the realm is LAB.EXAMPLE.TEST, every address is a
# documentation value (RFC 5737, 198.51.100.0/24), every secret is generated per run, and
# nothing is published on the host. README.md says what runs and what each round checks.
#
# The round `gss` (E43, gss.sh) runs the controller's samba_dnsupdate and the client's
# nsupdate -g and gss_client.py against the zones set to secure only. Later packages add the
# Keycloak service for OIDC (E47), the LDAP rounds with the private CA of the controller's
# LDAPS certificate and the five-minute UI test (E48), and curl --negotiate against the web
# UI (E49). The weekly job on hosted runners runs the rounds; the lab is never a
# pull-request gate (R131).
#
# The controller and the client are built from samba.Dockerfile and client.Dockerfile on
# ubuntu:24.04 pinned by digest; the Tenko image is built from deploy/Dockerfile (or named
# by TENKO_IMAGE). Samba is GPL-licensed and Keycloak Apache-2.0; both are run only as
# containers here, nothing of them is copied into the repository or linked (ADR 0026).
#
# Variables (the round scripts set them): LAB_DIR (the work directory with the generated
# secrets and tenko.toml, required; each round writes the krb5.conf of its containers),
# TENKO_IMAGE (default tenko:lab),
# SAMBA_IMAGE (default tenko-lab-samba:local), CLIENT_IMAGE (default
# tenko-lab-client:local).

name: ${COMPOSE_PROJECT_NAME:-tenkoadlab}

services:
  # The domain controller: `samba-tool domain provision --dns-backend=NONE` for the realm
  # LAB.EXAMPLE.TEST (domain LAB) at first start, with the administrator password of the
  # run from LAB_DIR/secrets; its DNS is the Tenko node, so its own samba_dnsupdate
  # registers the locator records there through nsupdate -g (E43). It also serves the KDC
  # (88) and the password service (464) the client and Tenko talk to, and LDAP (389, 636,
  # WP13.6). Samba stores the file ACLs of its shares in extended attributes, which needs
  # CAP_SYS_ADMIN in a container; LAB_DIR/out is where the round's samba-tool commands
  # write the keytab of Tenko's account.
  samba:
    image: ${SAMBA_IMAGE:-tenko-lab-samba:local}
    build:
      context: .
      dockerfile: samba.Dockerfile
    hostname: dc01
    domainname: lab.example.test
    restart: "no"
    cap_add:
      - SYS_ADMIN
    environment:
      LAB_REALM: LAB.EXAMPLE.TEST
      LAB_DOMAIN: LAB
    dns:
      - 198.51.100.3
    dns_search:
      - lab.example.test
    expose:
      - "88/tcp"
      - "88/udp"
      - "389/tcp"
      - "464/tcp"
      - "464/udp"
      - "636/tcp"
    volumes:
      - "samba-data:/var/lib/samba"
      - "${LAB_DIR:?set LAB_DIR}/secrets:/lab/secrets:ro"
      - "${LAB_DIR:?set LAB_DIR}/out:/lab/out"
    networks:
      lab:
        ipv4_address: 198.51.100.2

  # One node with the roles controller and dns, the DNS module on and the Lab profile,
  # primary of lab.example.test and _msdcs.lab.example.test. The DNS role listens on 53
  # inside the lab network: the image runs as a user without privileges and without
  # capabilities, so the container's network namespace lets unprivileged processes bind
  # ports from 53 up (a sysctl of the namespace, nothing on the host). The API is plain
  # HTTP on 8443 (the Lab profile allows it), on the lab network only. The round's script
  # writes tenko.toml into LAB_DIR.
  tenko:
    image: ${TENKO_IMAGE:-tenko:lab}
    hostname: ns1
    domainname: lab.example.test
    command: ["--roles", "controller,dns", "--config", "/lab/tenko.toml"]
    restart: "no"
    stop_grace_period: 30s
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "53"
    expose:
      - "53/tcp"
      - "53/udp"
      - "8443/tcp"
    environment:
      TENKO_KEK__PROVIDER: file
      TENKO_KEK__PATH: /run/secrets/kek
      # The lab has no route out: no breach lookups, no update checks.
      TENKO_HIBP__ONLINE: "false"
      TENKO_UPDATES__AIR_GAPPED: "true"
    secrets:
      - kek
    healthcheck:
      test: ["CMD", "/usr/local/bin/tenko", "health", "--url", "http://127.0.0.1:8443"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 3
    volumes:
      - "tenko-data:/var/lib/tenko"
      - "${LAB_DIR:?set LAB_DIR}/tenko.toml:/lab/tenko.toml:ro"
    networks:
      lab:
        ipv4_address: 198.51.100.3

  # A Linux client with MIT Kerberos (kinit, klist), nsupdate -g from BIND's tools, curl
  # and python3 with the MIT GSSAPI bindings: the rows of E43 (adds, replaces and deletes
  # over UDP and TCP, the refusals of an unsigned update, a replay, a skewed signature, an
  # unknown and an expired context, a second principal and NTLM alone) and E49 (curl
  # --negotiate, WP13.7). Its DNS is the Tenko node; the round scripts are mounted from this
  # directory. It is also where the round calls the node's API, since a Docker Desktop host
  # does not reach the lab network.
  client:
    image: ${CLIENT_IMAGE:-tenko-lab-client:local}
    build:
      context: .
      dockerfile: client.Dockerfile
    hostname: ws01
    domainname: lab.example.test
    restart: "no"
    dns:
      - 198.51.100.3
    dns_search:
      - lab.example.test
    volumes:
      - "${LAB_DIR:?set LAB_DIR}/secrets:/lab/secrets:ro"
      - "./gss_client.py:/lab/gss_client.py:ro"
    networks:
      lab:
        ipv4_address: 198.51.100.4
    command: ["sleep", "infinity"]

secrets:
  kek:
    file: "${LAB_DIR:?set LAB_DIR}/secrets/kek"

volumes:
  samba-data:
  tenko-data:

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 198.51.100.0/24
