# The cluster lab: three controllers, two probes and HAProxy on one Docker host (WP3.1c,
# E9). A lab, not a deployment: every secret is generated by driver.sh for one run and the
# names and addresses are documentation values (RFC 5737, example.test). README.md has the
# commands; smoke.sh (on the host) brings the lab up and runs driver.sh in the client
# container, which joins the controllers, checks failover and a partition; smoke.sh tears
# it down.
#
# - controller-1..3: the controller role behind HAProxy in TLS mode `reverse_proxy` (the
#   lab network's HAProxy address and the loopback are the trusted proxies), the cluster
#   port 8444 on the lab network, each advertising its service name. controller-1 is set
#   up first; controller-2 and -3 join it with `tenko cluster join` (run by driver.sh in
#   their own containers before their first start) and then start from the configuration
#   file the join writes into their data volume.
# - probe-1, probe-2 (profile `probes`): probe nodes, enrolled by driver.sh. They reach the
#   controllers' cluster ports directly; mutual TLS cannot pass a proxy that ends TLS.
# - haproxy: ends TLS with the lab certificate driver.sh generates, checks every controller
#   on GET /api/v1/health/ready every 2 s, keeps a client on one controller with the cookie
#   TENKOSRV, and holds event streams open (haproxy.cfg). Published on the loopback only.
# - client: the lab driver (deploy/compose/driver), the container the lab is driven from:
#   curl for the API through HAProxy, openssl for the lab CA, python3. It runs driver.sh
#   with the lab volume at /work and this directory's parent at /src (read-only), and asks
#   the host for every container operation, the partition included (smoke.sh runs
#   `docker network disconnect` and `connect`); it has no Docker socket.
#
# The lab volume `lab` holds the files of one run, written by driver.sh: tls/ (the lab CA
# and HAProxy's certificate, HAProxy's /lab/tls), public/ (the lab CA alone, /lab in the
# controllers and probes), kek-1/ to kek-3/ (each controller's key-encryption key, its
# /run/secrets), the cookie jar. Variables (smoke.sh sets them): TENKO_IMAGE (default
# tenko:lab), TENKO_IMAGE_1..3 (one controller on another image, for a mixed-version run),
# DRIVER_IMAGE (default tenko-lab-driver:local), LAB_PORT (default 28443).

name: ${COMPOSE_PROJECT_NAME:-tenkolab}

x-controller-environment: &controller-environment
  TENKO_KEK__PROVIDER: file
  TENKO_TLS__MODE: reverse_proxy
  TENKO_TLS__PUBLIC_HOST: localhost
  # HAProxy, and the loopback for the health check and the command line inside a container.
  TENKO_TLS__TRUSTED_PROXIES: '["198.51.100.2", "127.0.0.1"]'
  TENKO_SERVER__LISTEN: '["0.0.0.0:8443"]'
  TENKO_SERVER__ALLOWED_ORIGINS: '["https://localhost:${LAB_PORT:-28443}", "http://127.0.0.1:8443"]'
  TENKO_CLUSTER__LISTEN: '["0.0.0.0:8444"]'
  # The lab has no route out: no breach lookups, no update checks.
  TENKO_HIBP__ONLINE: "false"
  TENKO_UPDATES__AIR_GAPPED: "true"
  # One load generator behind HAProxy is one client address; the limiter would throttle it.
  TENKO_RATE_LIMIT__ENABLED: "false"
  # `tenko cluster join` and `tenko node enroll` reach the API through HAProxy, whose
  # certificate the lab CA signed.
  SSL_CERT_FILE: /lab/ca.pem

x-controller: &controller
  image: ${TENKO_IMAGE:-tenko:lab}
  # The smoke kills controllers on purpose; nothing restarts them behind its back.
  restart: "no"
  stop_grace_period: 30s
  expose:
    - "8443/tcp"
    - "8444/tcp"
  healthcheck:
    test: ["CMD", "/usr/local/bin/tenko", "health", "--url", "http://127.0.0.1:8443"]
    interval: 5s
    timeout: 5s
    start_period: 120s
    retries: 3
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - lab

x-probe: &probe
  image: ${TENKO_IMAGE:-tenko:lab}
  profiles: ["probes"]
  command: ["--roles", "probe"]
  restart: "no"
  stop_grace_period: 30s
  environment:
    SSL_CERT_FILE: /lab/ca.pem
  healthcheck:
    test: ["CMD", "/usr/local/bin/tenko", "node", "status", "--check", "--data-dir", "/var/lib/tenko"]
    interval: 10s
    timeout: 10s
    start_period: 60s
    retries: 3
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - lab

services:
  controller-1:
    <<: *controller
    image: ${TENKO_IMAGE_1:-${TENKO_IMAGE:-tenko:lab}}
    environment:
      <<: *controller-environment
      TENKO_KEK__PATH: /run/secrets/kek_1
      TENKO_NODE__ADDRESS: controller-1:8444
      TENKO_CLUSTER__ADVERTISE: '["controller-1:8444"]'
    volumes:
      - "data-1:/var/lib/tenko"
      - type: volume
        source: lab
        target: /run/secrets
        read_only: true
        volume:
          subpath: kek-1
      - type: volume
        source: lab
        target: /lab
        read_only: true
        volume:
          subpath: public

  controller-2:
    <<: *controller
    image: ${TENKO_IMAGE_2:-${TENKO_IMAGE:-tenko:lab}}
    # The file `tenko cluster join` wrote: [node] id and address, [cluster] listen.
    command: ["--config", "/var/lib/tenko/tenko.toml"]
    environment:
      <<: *controller-environment
      TENKO_KEK__PATH: /run/secrets/kek_2
      TENKO_CLUSTER__ADVERTISE: '["controller-2:8444"]'
    volumes:
      - "data-2:/var/lib/tenko"
      - type: volume
        source: lab
        target: /run/secrets
        read_only: true
        volume:
          subpath: kek-2
      - type: volume
        source: lab
        target: /lab
        read_only: true
        volume:
          subpath: public

  controller-3:
    <<: *controller
    image: ${TENKO_IMAGE_3:-${TENKO_IMAGE:-tenko:lab}}
    command: ["--config", "/var/lib/tenko/tenko.toml"]
    environment:
      <<: *controller-environment
      TENKO_KEK__PATH: /run/secrets/kek_3
      TENKO_CLUSTER__ADVERTISE: '["controller-3:8444"]'
    volumes:
      - "data-3:/var/lib/tenko"
      - type: volume
        source: lab
        target: /run/secrets
        read_only: true
        volume:
          subpath: kek-3
      - type: volume
        source: lab
        target: /lab
        read_only: true
        volume:
          subpath: public

  probe-1:
    <<: *probe
    volumes:
      - "probe-data-1:/var/lib/tenko"
      - type: volume
        source: lab
        target: /lab
        read_only: true
        volume:
          subpath: public

  probe-2:
    <<: *probe
    volumes:
      - "probe-data-2:/var/lib/tenko"
      - type: volume
        source: lab
        target: /lab
        read_only: true
        volume:
          subpath: public

  haproxy:
    image: ${HAPROXY_IMAGE:-haproxy:3.0}
    restart: "no"
    ports:
      - "127.0.0.1:${LAB_PORT:-28443}:8443/tcp"
    volumes:
      - "./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
      - type: volume
        source: lab
        target: /lab/tls
        read_only: true
        volume:
          subpath: tls
    networks:
      lab:
        ipv4_address: 198.51.100.2

  # The lab driver (deploy/compose/driver/Dockerfile): it idles until smoke.sh runs
  # driver.sh in it. Root in its own container (it writes the lab volume, which the other
  # services read as other users), no capability, no Docker socket.
  client:
    image: ${DRIVER_IMAGE:-tenko-lab-driver:local}
    restart: "no"
    stop_grace_period: 1s
    volumes:
      - "lab:/work"
      - "..:/src:ro"
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - lab

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 198.51.100.0/24
          gateway: 198.51.100.1
          # Containers get addresses from the upper half; HAProxy keeps 198.51.100.2.
          ip_range: 198.51.100.128/25

volumes:
  # The files of the run (see the top); `down --volumes` removes it with the lab.
  lab: {}
  data-1: {}
  data-2: {}
  data-3: {}
  probe-data-1: {}
  probe-data-2: {}
