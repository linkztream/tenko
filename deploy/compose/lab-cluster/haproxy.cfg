# HAProxy in front of the three controllers of the cluster lab (S3-Q3). It ends TLS with
# the lab certificate (smoke.sh writes /lab/tls/haproxy.pem: the certificate, the lab CA
# and the key) and talks plain HTTP to the controllers, which run in TLS mode
# `reverse_proxy` with this proxy's address as the trusted proxy.
#
# - Health: GET /api/v1/health/ready every 2 s; two failures take a controller out, two
#   successes bring it back.
# - Stickiness: the cookie TENKOSRV keeps a client on one controller (read-your-writes is
#   cheap there); correctness does not depend on it, every controller holds the same data.
# - A connection that could not be made is retried on another controller; a request that
#   reached a controller is not (a write carries an Idempotency-Key, so the client may
#   retry it).
# - /api/v1/events: the event stream, held open for an hour by its own backend.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    # A controller cut off the network answers no check: fail it fast.
    timeout check 1s
    timeout client 60s
    timeout server 60s
    retries 2
    option redispatch
    retry-on conn-failure

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s
    hold nx 2s

frontend lab
    bind :8443 ssl crt /lab/tls/haproxy.pem alpn http/1.1
    # An event stream is quiet between its keep-alive comments.
    timeout client 1h
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    use_backend events if { path_beg /api/v1/events }
    default_backend controllers

backend controllers
    balance roundrobin
    option httpchk GET /api/v1/health/ready
    http-check expect status 200
    cookie TENKOSRV insert indirect nocache
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server controller-1 controller-1:8443 check cookie c1
    server controller-2 controller-2:8443 check cookie c2
    server controller-3 controller-3:8443 check cookie c3

backend events
    balance roundrobin
    option httpchk GET /api/v1/health/ready
    http-check expect status 200
    cookie TENKOSRV insert indirect nocache
    timeout server 1h
    timeout tunnel 1h
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server controller-1 controller-1:8443 check cookie c1
    server controller-2 controller-2:8443 check cookie c2
    server controller-3 controller-3:8443 check cookie c3
