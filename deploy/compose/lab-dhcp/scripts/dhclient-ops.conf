# dhclient's configuration for E27's user-class row (WP8.4): the lab's settings and a user
# class (option 77, sent as plain text as dhclient does) that the class `ops` matches.
timeout 20;
retry 5;
initial-interval 1;
backoff-cutoff 2;
send user-class "lab-ops";
request subnet-mask, broadcast-address, routers, domain-name-servers, domain-name,
        ntp-servers, dhcp-lease-time, dhcp-renewal-time, dhcp-rebinding-time;
