# dhclient's configuration for E27's vendor-class row (WP8.4): the lab's settings and a
# vendor class identifier (option 60) that the class `printers` matches by prefix.
timeout 20;
retry 5;
initial-interval 1;
backoff-cutoff 2;
send vendor-class-identifier "Printer-Lab-1";
request subnet-mask, broadcast-address, routers, domain-name-servers, domain-name,
        ntp-servers, dhcp-lease-time, dhcp-renewal-time, dhcp-rebinding-time;
