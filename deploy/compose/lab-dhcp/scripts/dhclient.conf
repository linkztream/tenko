# dhclient's configuration in the lab clients: short timeouts so that a refused client
# (the filter row) fails in seconds, and the options of E23 asked for.
timeout 20;
retry 5;
initial-interval 1;
backoff-cutoff 2;
request subnet-mask, broadcast-address, routers, domain-name-servers, domain-name,
        ntp-servers, dhcp-lease-time, dhcp-renewal-time, dhcp-rebinding-time;
