# dhclient -6 in the clients of the round dhcp6 of the DHCP lab: short timeouts, and the
# options of the rows asked for: the DNS servers (23), the domain search list (24) and the
# NTP servers (56, RFC 5908). dhclient has no definition of option 56, so the lab gives
# one: the option encapsulates the sub-option 1 (an IPv6 address), and the sub-options of
# DHCPv6 have two-octet codes and lengths.
timeout 20;
retry 5;
option space ntp6 code width 2 length width 2 hash size 3;
option ntp6.srv-addr code 1 = ip6-address;
option dhcp6.ntp-server code 56 = encapsulate ntp6;
request dhcp6.name-servers, dhcp6.domain-search, dhcp6.ntp-server;
