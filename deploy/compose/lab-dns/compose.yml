# The DNS lab: BIND 9 as the authoritative upstream of one Tenko node, over plain DNS, DNS
# over TLS and DNS over HTTPS (WP5.1, deliverable 6). A lab, not a deployment: the
# certificate is generated by driver.sh for one run and the names and addresses are
# documentation values (RFC 5737, example.test). README.md has the commands; smoke.sh (on
# the host) starts the lab and runs driver.sh in the client container, which runs three
# rounds, one per transport, and in the last one cuts BIND off to see serve-stale.
#
# - bind: the official ISC image, authoritative for example.test (named.conf, the zone
#   example.test.zone with a 5 second TTL), no recursion. It answers on 53 (UDP and TCP),
#   853 (DNS over TLS) and 443 (DNS over HTTPS, /dns-query) with the lab certificate for
#   bind.example.test and 203.0.113.2. Its query log goes to `docker compose logs bind`.
# - tenko: one node with the roles controller and dns, the DNS module on and the Lab
#   profile, so recursion is open to the lab's client. driver.sh writes the configuration
#   file of each round into the lab volume (tenko/tenko.toml) and has the host recreate
#   the container; the data volume stays. The DNS role listens on 5300 (UDP and TCP), above
#   1024, so the container needs no capability. The API is plain HTTP (the Lab profile) on
#   8443, on the lab network only.
# - client: the lab driver (deploy/compose/driver), the container the lab is driven from:
#   dig, delv and nsupdate from BIND's own build, curl for the API, openssl for the lab CA,
#   BIND's signing tools and python3. It runs driver.sh with the lab volume at /work and
#   this directory's parent at /src (read-only), and asks the host for every container
#   operation; it has no Docker socket.
# - The transfer round (WP6.1): BIND is the secondary of Tenko's zones and the primary of
#   zones Tenko holds as secondary zones (transfer.conf), with the TSIG key of the run in
#   the lab volume's bind/keys.conf and its primary zone files in zones/; Tenko serves DoT
#   and XoT on 8530 with the lab certificate for tenko.example.test.
# - The recursion sandbox (WP10.0, profile `recursion`): authority and the quirk
#   responders, the lab root and its authorities for the recursive resolver (see the block
#   at the end).
#
# The lab volume `lab` holds the files of one run, written by driver.sh: tls/ (the lab CA
# and the certificates), secrets/ (the key-encryption key), tenko/ (the node's
# configuration, CA, certificate and root hints), bind/ (the TSIG key and the zones BIND
# signs), zones/ (BIND's writable zone files), authority/ and delv/. Each service mounts
# only its part. Nothing is published on the host. Variables (smoke.sh sets them):
# TENKO_IMAGE (default tenko:lab), BIND_IMAGE (default internetsystemsconsortium/bind9:9.20),
# DRIVER_IMAGE (default tenko-lab-driver:local), QUIRK_IMAGE (default tenko-quirk:lab).

name: ${COMPOSE_PROJECT_NAME:-tenkodnslab}

services:
  bind:
    image: ${BIND_IMAGE:-internetsystemsconsortium/bind9:9.20}
    # The image's own command logs to a file; -g logs to the standard error. named starts
    # as root and drops to the user bind (the image's entrypoint passes -u bind).
    command: ["-g", "-c", "/etc/bind/named.conf"]
    restart: "no"
    expose:
      - "53/tcp"
      - "53/udp"
      - "853/tcp"
      - "443/tcp"
    volumes:
      - "./named.conf:/etc/bind/named.conf:ro"
      - "./example.test.zone:/etc/bind/zones/example.test.zone:ro"
      - type: volume
        source: lab
        target: /etc/bind/tls
        read_only: true
        volume:
          subpath: tls
      # The transfer round (WP6.1): the zones with Tenko, the TSIG key of the run, and the
      # zone files BIND holds as the primary, writable for nsupdate (copied by driver.sh).
      - "./transfer.conf:/etc/bind/transfer.conf:ro"
      - type: volume
        source: lab
        target: /etc/bind/lab
        read_only: true
        volume:
          subpath: bind
      - type: volume
        source: lab
        target: /var/lib/lab-zones
        volume:
          subpath: zones
    networks:
      lab:
        ipv4_address: 203.0.113.2

  tenko:
    image: ${TENKO_IMAGE:-tenko:lab}
    command: ["--roles", "controller,dns", "--config", "/lab/tenko.toml"]
    # driver.sh has it stopped and recreated on purpose; nothing restarts it behind its back.
    restart: "no"
    stop_grace_period: 30s
    expose:
      - "5300/tcp"
      - "5300/udp"
      - "8443/tcp"
      # DNS over TLS and zone transfers over TLS (XoT) in the transfer round.
      - "8530/tcp"
    environment:
      TENKO_KEK__PROVIDER: file
      TENKO_KEK__PATH: /run/secrets/kek
      # The lab has no route out: no breach lookups, no update checks.
      TENKO_HIBP__ONLINE: "false"
      TENKO_UPDATES__AIR_GAPPED: "true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/tenko", "health", "--url", "http://127.0.0.1:8443"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 3
    volumes:
      - "tenko-data:/var/lib/tenko"
      # tenko.toml of the round, the lab CA, the certificate of DoT and XoT in the transfer
      # round (tenko.example.test) and, WP10.1, the lab root's hints for the round
      # `recursion` (written for every round).
      - type: volume
        source: lab
        target: /lab
        read_only: true
        volume:
          subpath: tenko
      # The key-encryption key of the run.
      - type: volume
        source: lab
        target: /run/secrets
        read_only: true
        volume:
          subpath: secrets
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      lab:
        ipv4_address: 203.0.113.3

  # The lab driver (deploy/compose/driver/Dockerfile): it idles until smoke.sh runs
  # driver.sh in it. Root in its own container (it writes the lab volume, which the other
  # services read as other users), no capability, no Docker socket.
  client:
    image: ${DRIVER_IMAGE:-tenko-lab-driver:local}
    restart: "no"
    stop_grace_period: 1s
    volumes:
      - "lab:/work"
      - "..:/src:ro"
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      lab:
        ipv4_address: 203.0.113.4

  # WP10.0: the recursion sandbox (dns-recursion-plan.md section 2.12), under the compose
  # profile `recursion`: `docker compose up` for the other rounds starts none of these, and
  # smoke.sh is unchanged. Empty shells until WP10.1 (the lab root and the quirk responder)
  # and WP10.2 (the signed zones, the BIND zones and the rounds) fill them.
  #
  # authority: a second Tenko node serving the lab root `.` (NS a.root.test, glue
  # 203.0.113.10), the TLD `test`, and the signed test zones under it (example.test and its
  # children). Its Lab profile configuration is authority/authority.toml in the lab
  # volume, written by the round `recursion`. It answers on port 53, as a root server must (the resolver
  # follows glue addresses on 53), so the container lowers the unprivileged port start
  # instead of keeping a capability.
  authority:
    image: ${TENKO_IMAGE:-tenko:lab}
    profiles: ["recursion"]
    command: ["--roles", "controller,dns", "--config", "/lab/authority.toml"]
    restart: "no"
    stop_grace_period: 30s
    expose:
      - "53/tcp"
      - "53/udp"
      - "8443/tcp"
    environment:
      TENKO_KEK__PROVIDER: file
      TENKO_KEK__PATH: /run/secrets/kek
      TENKO_HIBP__ONLINE: "false"
      TENKO_UPDATES__AIR_GAPPED: "true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/tenko", "health", "--url", "http://127.0.0.1:8443"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 3
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    volumes:
      - "authority-data:/var/lib/tenko"
      - type: volume
        source: lab
        target: /lab
        read_only: true
        volume:
          subpath: authority
      - type: volume
        source: lab
        target: /run/secrets
        read_only: true
        volume:
          subpath: secrets
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      lab:
        ipv4_address: 203.0.113.10

  # WP10.1: the quirk responders, the engine's example authoritative server
  # (crates/tenko-dns/examples/authoritative.rs in its quirk mode, built for musl into
  # QUIRK_IMAGE by deploy/compose/lab-dns/quirk.Dockerfile), one misbehavior of E36 each,
  # each authoritative for its zone under quirk.example.test and delegated from
  # example.test with glue at its address: no EDNS (FORMERR on OPT), 0x20 broken (answers in
  # lower case), TC on every UDP answer, answers delayed by 2.5 s, answers from the wrong
  # source port, and a referral with out-of-bailiwick glue (to ns.elsewhere.test, whose
  # real address is quirk-sub's; the glue points at 203.0.113.66, where nothing answers).
  quirk-noedns: &quirk
    image: ${QUIRK_IMAGE:-tenko-quirk:lab}
    profiles: ["recursion"]
    command: ["--quirk-zone", "noedns.quirk.example.test", "--quirk-address", "203.0.113.11", "--no-edns"]
    restart: "no"
    stop_grace_period: 1s
    expose:
      - "53/tcp"
      - "53/udp"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      lab:
        ipv4_address: 203.0.113.11

  quirk-case:
    <<: *quirk
    command: ["--quirk-zone", "case.quirk.example.test", "--quirk-address", "203.0.113.13", "--lower-case"]
    networks:
      lab:
        ipv4_address: 203.0.113.13

  quirk-tc:
    <<: *quirk
    command: ["--quirk-zone", "tc.quirk.example.test", "--quirk-address", "203.0.113.14", "--truncate"]
    networks:
      lab:
        ipv4_address: 203.0.113.14

  quirk-slow:
    <<: *quirk
    command: ["--quirk-zone", "slow.quirk.example.test", "--quirk-address", "203.0.113.15", "--delay-ms", "2500"]
    networks:
      lab:
        ipv4_address: 203.0.113.15

  quirk-spoof:
    <<: *quirk
    command: ["--quirk-zone", "spoof.quirk.example.test", "--quirk-address", "203.0.113.16", "--wrong-source"]
    networks:
      lab:
        ipv4_address: 203.0.113.16

  quirk-oob:
    <<: *quirk
    command: ["--quirk-zone", "oob.quirk.example.test", "--quirk-address", "203.0.113.17",
              "--referral", "sub.oob.quirk.example.test=ns.elsewhere.test",
              "--glue", "ns.elsewhere.test=203.0.113.66"]
    networks:
      lab:
        ipv4_address: 203.0.113.17

  quirk-sub:
    <<: *quirk
    command: ["--quirk-zone", "sub.oob.quirk.example.test", "--quirk-address", "203.0.113.18"]
    networks:
      lab:
        ipv4_address: 203.0.113.18
  # WP10.1: end.

  # WP10.3: a server that answers NXDOMAIN for its empty non-terminals (b and a.b of its
  # zone, above www.a.b), which QNAME minimization falls back for; it prints every question,
  # the witness of the rows of E35 (denial.sh).
  quirk-ent:
    <<: *quirk
    command: ["--quirk-zone", "ent.quirk.example.test", "--quirk-address", "203.0.113.21",
              "--nxdomain-ent"]
    networks:
      lab:
        ipv4_address: 203.0.113.21
  # WP10.3: end.

  # delv, the client side's second validator, runs in the driver (`client`): `delv
  # @203.0.113.3 ...` (or against the authority) validates independently of Tenko with the
  # lab root's trust anchor, which the round writes into delv/root.key in the lab volume
  # (E33, WP10.2).
  #
  # The bind service above also serves, in the recursion round, the zones the driver signs
  # with BIND's tools and keys of the run (bind.example.test, optout.example.test and its
  # unsigned child, expired.example.test, badsig.example.test, keytrap.example.test;
  # validation.sh): named.conf includes bind/recursion.conf of the lab volume, and the
  # signed files are in zones/.
  # WP10.0: end.

  # WP10.2: the upstreams of the forwarded rows (recursion plan section 2.3).
  #
  # bind-resolver: BIND as a recursive resolver with validation off, resolving from the lab
  # root (recursion/bind-resolver.conf, the lab root's hints): the upstream of a forwarding
  # rule whose answers Tenko validates, and the second validator's path for them.
  bind-resolver:
    image: ${BIND_IMAGE:-internetsystemsconsortium/bind9:9.20}
    profiles: ["recursion"]
    command: ["-g", "-c", "/etc/bind/named.conf"]
    restart: "no"
    expose:
      - "53/tcp"
      - "53/udp"
    volumes:
      - "./recursion/bind-resolver.conf:/etc/bind/named.conf:ro"
      - "./recursion/root.hints:/etc/bind/root.hints:ro"
    networks:
      lab:
        ipv4_address: 203.0.113.20

  # quirk-strip: the quirk responder as a proxy in front of bind-resolver that strips the
  # RRSIG, NSEC and NSEC3 records from every answer: the upstream that makes a rule's
  # answers bogus and sets dns.forwarder.strips_dnssec.
  quirk-strip:
    <<: *quirk
    command: ["--quirk-zone", "strip.quirk.example.test", "--quirk-address", "203.0.113.19",
              "--proxy", "203.0.113.20", "--strip-dnssec"]
    networks:
      lab:
        ipv4_address: 203.0.113.19
  # WP10.2: end.

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.1

volumes:
  # The files of the run (see the top); `down --volumes` removes it with the lab.
  lab: {}
  tenko-data: {}
  # WP10.0: the data of the authority node (profile recursion).
  authority-data: {}
