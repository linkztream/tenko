# The DNS lab: BIND 9 as the authoritative upstream of one Tenko node, over plain DNS, DNS
# over TLS and DNS over HTTPS (WP5.1, deliverable 6). A lab, not a deployment: the
# certificate is generated by smoke.sh for one run and the names and addresses are
# documentation values (RFC 5737, example.test). README.md has the commands; smoke.sh runs
# three rounds, one per transport, and in the last one cuts BIND off to see serve-stale.
#
# - bind: the official ISC image, authoritative for example.test (named.conf, the zone
#   example.test.zone with a 5 second TTL), no recursion. It answers on 53 (UDP and TCP),
#   853 (DNS over TLS) and 443 (DNS over HTTPS, /dns-query) with the lab certificate for
#   bind.example.test and 203.0.113.2. Its query log goes to `docker compose logs bind`.
# - tenko: one node with the roles controller and dns, the DNS module on and the Lab
#   profile, so recursion is open to the lab's client. smoke.sh writes the configuration
#   file of each round into LAB_DIR (tenko.toml) and recreates the container; the data
#   volume stays. The DNS role listens on 5300 (UDP and TCP), above 1024, so the container
#   needs no capability. The API is plain HTTP (the Lab profile) on 8443, on the lab network
#   only.
# - client: the BIND image again, for `dig` and `nsupdate`. It asks Tenko and BIND.
# - The transfer round (WP6.1): BIND is the secondary of Tenko's zones and the primary of
#   zones Tenko holds as secondary zones (transfer.conf), with the TSIG key of the run in
#   LAB_DIR/bind/keys.conf and its primary zone files in LAB_DIR/zones; Tenko serves DoT
#   and XoT on 8530 with the lab certificate for tenko.example.test.
# - The recursion sandbox (WP10.0, profile `recursion`): authority, quirk and delv, the lab
#   root and its authorities for the recursive resolver (see the block at the end).
#
# Nothing is published on the host. Variables (smoke.sh sets them): LAB_DIR (the work
# directory with tls/, secrets/ and tenko.toml, required), TENKO_IMAGE (default tenko:lab),
# BIND_IMAGE (default internetsystemsconsortium/bind9:9.20).

name: ${COMPOSE_PROJECT_NAME:-tenkodnslab}

services:
  bind:
    image: ${BIND_IMAGE:-internetsystemsconsortium/bind9:9.20}
    # The image's own command logs to a file; -g logs to the standard error. named starts
    # as root and drops to the user bind (the image's entrypoint passes -u bind).
    command: ["-g", "-c", "/etc/bind/named.conf"]
    restart: "no"
    expose:
      - "53/tcp"
      - "53/udp"
      - "853/tcp"
      - "443/tcp"
    volumes:
      - "./named.conf:/etc/bind/named.conf:ro"
      - "./example.test.zone:/etc/bind/zones/example.test.zone:ro"
      - "${LAB_DIR:?set LAB_DIR}/tls:/etc/bind/tls:ro"
      # The transfer round (WP6.1): the zones with Tenko, the TSIG key of the run, and the
      # zone files BIND holds as the primary, writable for nsupdate (copied by smoke.sh).
      - "./transfer.conf:/etc/bind/transfer.conf:ro"
      - "${LAB_DIR:?set LAB_DIR}/bind:/etc/bind/lab:ro"
      - "${LAB_DIR:?set LAB_DIR}/zones:/var/lib/lab-zones"
    networks:
      lab:
        ipv4_address: 203.0.113.2

  tenko:
    image: ${TENKO_IMAGE:-tenko:lab}
    command: ["--roles", "controller,dns", "--config", "/lab/tenko.toml"]
    # smoke.sh stops and recreates it on purpose; nothing restarts it behind its back.
    restart: "no"
    stop_grace_period: 30s
    expose:
      - "5300/tcp"
      - "5300/udp"
      - "8443/tcp"
      # DNS over TLS and zone transfers over TLS (XoT) in the transfer round.
      - "8530/tcp"
    environment:
      TENKO_KEK__PROVIDER: file
      TENKO_KEK__PATH: /run/secrets/kek
      # The lab has no route out: no breach lookups, no update checks.
      TENKO_HIBP__ONLINE: "false"
      TENKO_UPDATES__AIR_GAPPED: "true"
    secrets:
      - kek
    healthcheck:
      test: ["CMD", "/usr/local/bin/tenko", "health", "--url", "http://127.0.0.1:8443"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 3
    volumes:
      - "tenko-data:/var/lib/tenko"
      - "${LAB_DIR:?set LAB_DIR}/tenko.toml:/lab/tenko.toml:ro"
      - "${LAB_DIR:?set LAB_DIR}/tls/ca.pem:/lab/ca.pem:ro"
      # The certificate of DoT and XoT in the transfer round (tenko.example.test).
      - "${LAB_DIR:?set LAB_DIR}/tls/tenko.pem:/lab/tenko.pem:ro"
      - "${LAB_DIR:?set LAB_DIR}/tls/tenko.key:/lab/tenko.key:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      lab:
        ipv4_address: 203.0.113.3

  client:
    image: ${BIND_IMAGE:-internetsystemsconsortium/bind9:9.20}
    # The image's entrypoint is named; the client only needs dig.
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    stop_grace_period: 1s
    volumes:
      # For dig +tls and dig +https against BIND.
      - "${LAB_DIR:?set LAB_DIR}/tls/ca.pem:/lab/ca.pem:ro"
    networks:
      lab:
        ipv4_address: 203.0.113.4

  # WP10.0: the recursion sandbox (dns-recursion-plan.md section 2.12), under the compose
  # profile `recursion`: `docker compose up` for the other rounds starts none of these, and
  # smoke.sh is unchanged. Empty shells until WP10.1 (the lab root and the quirk responder)
  # and WP10.2 (the signed zones, the BIND zones and the rounds) fill them.
  #
  # authority: a second Tenko node serving the lab root `.` (NS a.root.test, glue
  # 203.0.113.10), the TLD `test`, and the signed test zones under it (example.test and its
  # children). Its Lab profile configuration is LAB_DIR/authority/authority.toml, written
  # by the round `recursion`. It answers on port 53, as a root server must (the resolver
  # follows glue addresses on 53), so the container lowers the unprivileged port start
  # instead of keeping a capability.
  authority:
    image: ${TENKO_IMAGE:-tenko:lab}
    profiles: ["recursion"]
    command: ["--roles", "controller,dns", "--config", "/lab/authority.toml"]
    restart: "no"
    stop_grace_period: 30s
    expose:
      - "53/tcp"
      - "53/udp"
      - "8443/tcp"
    environment:
      TENKO_KEK__PROVIDER: file
      TENKO_KEK__PATH: /run/secrets/kek
      TENKO_HIBP__ONLINE: "false"
      TENKO_UPDATES__AIR_GAPPED: "true"
    secrets:
      - kek
    healthcheck:
      test: ["CMD", "/usr/local/bin/tenko", "health", "--url", "http://127.0.0.1:8443"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 3
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    volumes:
      - "authority-data:/var/lib/tenko"
      - "${LAB_DIR:?set LAB_DIR}/authority:/lab:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      lab:
        ipv4_address: 203.0.113.10

  # quirk: the engine's example authoritative server (crates/tenko-dns/examples/authoritative.rs,
  # built for musl like the binary) with the misbehaviours of E36 as flags: no EDNS (FORMERR
  # on OPT), 0x20 broken (answers in lower case), TC on everything, delayed answers, answers
  # from the wrong source address. It is authoritative for quirk.example.test, delegated
  # from example.test with glue at this address. WP10.1 builds it into the image named by
  # QUIRK_IMAGE and gives it its entrypoint; the entrypoint below is the placeholder it
  # replaces, so this service does not start before then.
  quirk:
    image: ${QUIRK_IMAGE:-tenko:lab}
    profiles: ["recursion"]
    entrypoint: ["/usr/local/bin/quirk"]
    restart: "no"
    stop_grace_period: 1s
    expose:
      - "53/tcp"
      - "53/udp"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      lab:
        ipv4_address: 203.0.113.11

  # delv: the client side's second validator. The BIND image idles as the `client` does;
  # `docker compose exec delv delv @203.0.113.3 ...` (or against the authority) validates
  # independently of Tenko with the lab root's trust anchor, which WP10.2 puts into
  # /lab/root.key (E33).
  delv:
    image: ${BIND_IMAGE:-internetsystemsconsortium/bind9:9.20}
    profiles: ["recursion"]
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    stop_grace_period: 1s
    networks:
      lab:
        ipv4_address: 203.0.113.12

  # The bind service above is unchanged here; WP10.2 gives it bind.example.test (signed by
  # BIND with its own keys, the DS in example.test), optout.example.test and
  # expired.example.test (made per run with dnssec-keygen and dnssec-signzone).
  # WP10.0: end.

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.1

secrets:
  kek:
    file: ${LAB_DIR:?set LAB_DIR}/secrets/kek

volumes:
  tenko-data: {}
  # WP10.0: the data of the authority node (profile recursion).
  authority-data: {}
