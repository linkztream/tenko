// BIND 9 of the DNS lab (deploy/compose/lab-dns, WP5.1): the authoritative server for
// example.test that one Tenko node uses as its upstream, over plain DNS, DNS over TLS and
// DNS over HTTPS. A lab, not a deployment: the certificate is the lab's, generated by
// smoke.sh for one run, and BIND answers every client of the lab network.
//
// BIND does not recurse; example.test is the zone of the resolver rounds, transfer.conf holds
// the zones of the transfer round (WP6.1). The query log is on and, because
// named runs with -g (compose.yml), goes to the container's standard error: smoke.sh reads
// in it whether the queries of Tenko came over UDP (plain DNS) or over a stream (the T
// flag; DNS over TLS and over HTTPS both arrive as streams).

// The TSIG key of the zone transfers (WP6.1), generated by smoke.sh for one run.
include "/etc/bind/lab/keys.conf";

tls lab-tls {
        cert-file "/etc/bind/tls/bind.pem";
        key-file "/etc/bind/tls/bind.key";
        protocols { TLSv1.2; TLSv1.3; };
};

http lab-http {
        endpoints { "/dns-query"; };
};

options {
        directory "/var/cache/bind";
        // Plain DNS on 53 (UDP and TCP), DNS over TLS on 853, DNS over HTTPS on 443.
        listen-on { any; };
        listen-on port 853 tls lab-tls { any; };
        listen-on port 443 tls lab-tls http lab-http { any; };
        listen-on-v6 { none; };

        recursion no;
        allow-query { any; };
        allow-transfer { none; };
        dnssec-validation no;
        version none;
        querylog yes;
        // NOTIFY only where a zone lists its targets (transfer.conf).
        notify no;
        // Tenko's catalog zone (WP6.1, RFC 9432): its members become secondary zones here.
        catalog-zones {
                zone "catalog.tenko.test"
                        default-primaries { 203.0.113.3 port 5300 key "xfr.example.test"; }
                        min-update-interval 1;
        };
};

zone "example.test" {
        type primary;
        file "/etc/bind/zones/example.test.zone";
};

// The zone transfers with Tenko (WP6.1).
include "/etc/bind/transfer.conf";

// WP10.2: the zones BIND signs with its own keys for the recursion round (validation.sh
// writes the file and the signed zones per run; empty in the other rounds).
include "/etc/bind/lab/recursion.conf";
