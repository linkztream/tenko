// BIND 9 of the DNS lab (deploy/compose/lab-dns, WP5.1): the authoritative server for
// example.test that one Tenko node uses as its upstream, over plain DNS, DNS over TLS and
// DNS over HTTPS. A lab, not a deployment: the certificate is the lab's, generated by
// smoke.sh for one run, and BIND answers every client of the lab network.
//
// BIND does not recurse; example.test is the only zone. The query log is on and, because
// named runs with -g (compose.yml), goes to the container's standard error: smoke.sh reads
// in it whether the queries of Tenko came over UDP (plain DNS) or over a stream (the T
// flag; DNS over TLS and over HTTPS both arrive as streams).

tls lab-tls {
        cert-file "/etc/bind/tls/bind.pem";
        key-file "/etc/bind/tls/bind.key";
        protocols { TLSv1.2; TLSv1.3; };
};

http lab-http {
        endpoints { "/dns-query"; };
};

options {
        directory "/var/cache/bind";
        // Plain DNS on 53 (UDP and TCP), DNS over TLS on 853, DNS over HTTPS on 443.
        listen-on { any; };
        listen-on port 853 tls lab-tls { any; };
        listen-on port 443 tls lab-tls http lab-http { any; };
        listen-on-v6 { none; };

        recursion no;
        allow-query { any; };
        allow-transfer { none; };
        dnssec-validation no;
        version none;
        querylog yes;
};

zone "example.test" {
        type primary;
        file "/etc/bind/zones/example.test.zone";
};
