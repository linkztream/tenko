// The recursive BIND of the recursion round (WP10.2, dns-recursion-plan.md section 2.12):
// the upstream of the lab's forwarded rows, resolving from the lab root with validation off,
// so that the answers Tenko validates through it carry the signatures as a resolver relays
// them. The service `bind-resolver` of compose.yml mounts this file and the lab root's
// hints (recursion/root.hints) as /etc/bind/named.conf and /etc/bind/root.hints.

options {
        directory "/var/cache/bind";
        listen-on { any; };
        listen-on-v6 { none; };
        recursion yes;
        allow-query { any; };
        allow-recursion { any; };
        dnssec-validation no;
        // The lab's names are under the special-use TLD test; nothing here is private.
        version none;
        querylog yes;
        notify no;
        // One root server: no need to spread.
        minimal-responses no;
};

zone "." {
        type hint;
        file "/etc/bind/root.hints";
};
