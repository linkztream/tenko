// The zone transfers of the DNS lab (WP6.1, deploy/compose/lab-dns): BIND as the secondary
// of zones Tenko holds as primary zones, and as the primary of zones Tenko holds as
// secondary zones, both ways with TSIG, NOTIFY, IXFR, zone transfers over TLS (XoT, RFC
// 9103) and a catalog zone (RFC 9432). A lab, not a deployment: the key is generated by
// smoke.sh for one run (lab/keys.conf, included by named.conf before this file), and every
// name and address is a documentation value.
//
// Tenko is 203.0.113.3: plain DNS on 5300 (UDP and TCP), DNS over TLS and XoT on 8530 with
// the lab certificate for tenko.example.test.

tls tenko-xot {
        ca-file "/etc/bind/tls/ca.pem";
        remote-hostname "tenko.example.test";
};

// BIND as the secondary of Tenko: TSIG and IXFR over TCP, NOTIFY from Tenko.
zone "out.example.test" {
        type secondary;
        primaries { 203.0.113.3 port 5300 key "xfr.example.test"; };
        file "/var/cache/bind/out.example.test.db";
};

// The same over TLS to Tenko's DoT port.
zone "xot.example.test" {
        type secondary;
        primaries { 203.0.113.3 port 8530 key "xfr.example.test" tls tenko-xot; };
        file "/var/cache/bind/xot.example.test.db";
};

// Tenko's catalog zone: its members become secondary zones of BIND (catalog-zones in the
// options of named.conf).
zone "catalog.tenko.test" {
        type secondary;
        primaries { 203.0.113.3 port 5300 key "xfr.example.test"; };
        file "/var/cache/bind/catalog.tenko.test.db";
};

// BIND as the primary of zones Tenko holds as secondary zones. smoke.sh changes them with
// nsupdate and the key; BIND then sends NOTIFY to Tenko, signed.
zone "in.example.test" {
        type primary;
        file "/var/lib/lab-zones/in.example.test.zone";
        allow-transfer { key "xfr.example.test"; };
        allow-update { key "xfr.example.test"; };
        notify explicit;
        also-notify { 203.0.113.3 port 5300 key "xfr.example.test"; };
};

// Transferred to Tenko over TLS only, on BIND's DoT port.
zone "inxot.example.test" {
        type primary;
        file "/var/lib/lab-zones/inxot.example.test.zone";
        allow-transfer port 853 transport tls { key "xfr.example.test"; };
        allow-update { key "xfr.example.test"; };
        notify explicit;
        also-notify { 203.0.113.3 port 5300 key "xfr.example.test"; };
};

// BIND's catalog zone with one member; Tenko holds it as a secondary catalog zone and
// makes the member a secondary zone of its own.
zone "catalog.bind.test" {
        type primary;
        file "/var/lib/lab-zones/catalog.bind.test.zone";
        allow-transfer { key "xfr.example.test"; };
        allow-update { key "xfr.example.test"; };
        notify explicit;
        also-notify { 203.0.113.3 port 5300 key "xfr.example.test"; };
};

zone "member.bind.test" {
        type primary;
        file "/var/lib/lab-zones/member.bind.test.zone";
        allow-transfer { key "xfr.example.test"; };
        notify explicit;
        also-notify { 203.0.113.3 port 5300 key "xfr.example.test"; };
};

// The zone of the measurement M19 (bench/phase2-dns/scripts/run-m19-xfr.sh): 100,000
// records on Tenko, BIND as the secondary. Retried quietly until the zone exists.
zone "big.example.test" {
        type secondary;
        primaries { 203.0.113.3 port 5300 key "xfr.example.test"; };
        file "/var/cache/bind/big.example.test.db";
};
