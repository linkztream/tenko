# Example only: copy and adapt before use.
#
# Runs tenko on a macvlan network, so the container is a first-class host on the client
# segment with its own address and can receive DHCP broadcasts.
#
# Phase 1 implements the controller role only (API, web UI, store, IPAM). The `dns` and
# `dhcp` roles do not exist yet. They are accepted in a role list next to `controller` and
# skipped with a notice, but a list without `controller` makes the container exit with
# status 2. This file therefore starts the controller; the macvlan network is what the
# DHCP role will need later. For a controller on a normal bridge network use
# controller.example.yml.
#
# Notes:
# - The macvlan `parent` must be the host NIC attached to the client network.
# - With macvlan the Docker host itself cannot reach the container's address
#   unless a macvlan shim interface is created on the host. Example, run as
#   root on the host (replace the NIC name and addresses):
#
#     ip link add tenko-shim link eth0 type macvlan mode bridge
#     ip addr add 192.0.2.7/32 dev tenko-shim && ip link set tenko-shim up
#     ip route add 192.0.2.8/29 dev tenko-shim
#
# - All addresses below are RFC 5737 documentation addresses and must be
#   replaced with addresses from your own network.
# - Create ./tenko.toml next to this file before starting (copy
#   deploy/tenko.example.toml). The image sets TENKO_DATA_DIR, which wins over data_dir
#   of the file.
# - Create the key-encryption key secret as described in controller.example.yml
#   (./secrets/tenko_kek, owned by uid 65532, mode 0400). The container has no
#   systemd-creds, so without it the key would be a plain file on the data volume.
# - First-run setup: read the one-time setup token with
#     docker compose -f macvlan.example.yml logs tenko | grep -E 'Setup token|setup_token'
#   and open https://192.0.2.10:8443/ (see controller.example.yml for `tenko setup`).
#
# Start with: docker compose -f macvlan.example.yml up --build

services:
  tenko:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: tenko:local
    # Phase 1: the controller. When the DNS and DHCP roles arrive, run
    # ["--roles", "controller,dns,dhcp", "--config", "/etc/tenko/tenko.toml"].
    command: ["--roles", "controller", "--config", "/etc/tenko/tenko.toml"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TENKO_KEK__PROVIDER: file
      TENKO_KEK__PATH: /run/secrets/tenko_kek
      # The certificate of the internal CA also names the container's address.
      TENKO_TLS__ADDRESSES: 192.0.2.10
    secrets:
      - tenko_kek
    # The controller listens on 8443 and needs no capability. The later roles will: DNS on
    # port 53 needs NET_BIND_SERVICE, DHCP needs NET_RAW (and 67/547 need
    # NET_BIND_SERVICE). Drop everything else.
    cap_drop:
      - ALL
    # cap_add:
    #   - NET_BIND_SERVICE
    #   - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      # SSD or NVMe only (OPS-19).
      - "tenko-data:/var/lib/tenko"
      - "./tenko.toml:/etc/tenko/tenko.toml:ro"
    networks:
      lan:
        ipv4_address: 192.0.2.10

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.1
          ip_range: 192.0.2.8/29

secrets:
  tenko_kek:
    file: ./secrets/tenko_kek

volumes:
  tenko-data: {}
