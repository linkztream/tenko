# Example only: copy and adapt before use.
#
# Runs tenko-server with the dns and dhcp roles on a macvlan network, so the
# container is a first-class host on the client segment and can receive DHCP
# broadcasts.
#
# Notes:
# - The macvlan `parent` must be the host NIC attached to the client network.
# - With macvlan the Docker host itself cannot reach the container's address
#   unless a macvlan shim interface is created on the host. Example, run as
#   root on the host (replace the NIC name and addresses):
#
#     ip link add tenko-shim link eth0 type macvlan mode bridge
#     ip addr add 192.0.2.7/32 dev tenko-shim && ip link set tenko-shim up
#     ip route add 192.0.2.8/29 dev tenko-shim
#
# - All addresses below are RFC 5737 documentation addresses and must be
#   replaced with addresses from your own network.
# - Create ./tenko.toml next to this file before starting.
#
# Start with: docker compose -f macvlan.example.yml up --build

services:
  tenko:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: tenko-server:local
    command: ["--roles", "dns,dhcp", "--config", "/etc/tenko/tenko.toml"]
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - "tenko-data:/var/lib/tenko"
      - "./tenko.toml:/etc/tenko/tenko.toml:ro"
    networks:
      lan:
        ipv4_address: 192.0.2.10

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.1
          ip_range: 192.0.2.8/29

volumes:
  tenko-data: {}
