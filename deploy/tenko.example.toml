# tenko.toml: the bootstrap configuration of a Tenko DDI node.
#
# Copy this file to /etc/tenko/tenko.toml (Linux), C:\ProgramData\Tenko\tenko.toml
# (Windows) or mount it at /etc/tenko/tenko.toml (containers), and adapt it. Every key
# below shows its default unless marked otherwise; delete what you do not change.
#
# The file carries only what a node needs to start. The security profile chosen in the
# first-run wizard, its toggles, users and all IPAM data live in the replicated store.
#
# Check a file with:   tenko config check --config /etc/tenko/tenko.toml
# Run the server with: tenko serve --config /etc/tenko/tenko.toml
#
# Environment variables override the file (containers): TENKO_ followed by the key path in
# upper case, with a double underscore between a section and its key, for example
#   TENKO_DATA_DIR=/var/lib/tenko
#   TENKO_TLS__MODE=reverse_proxy
#   TENKO_TLS__TRUSTED_PROXIES=10.0.0.5,10.0.0.6
#   TENKO_LOG__FORMAT=json
# A value is read as TOML when it parses as TOML (true, 8443, ["a", "b"]) and as a string
# otherwise; lists also accept a comma-separated string. The flags --data-dir and --roles
# override both.

# Directory with the state of this node (required here, with --data-dir or with
# TENKO_DATA_DIR). It holds kek/ (key-encryption keys), store/ (the replicated store),
# tls/ca-root.pem (the public root of the internal CA) and logs/. Put it on SSD or NVMe:
# rotating and SMR disks are not supported, and the server warns at start when a durable
# commit takes more than 10 ms (OPS-19). Keep it private to the service account.
data_dir = "/var/lib/tenko"

# Roles of this node: a comma-separated list of controller, dns, dhcp and probe, or "all".
# A controller node runs the dns, dhcp and probe roles in its own process (the dhcp role
# listens where [dhcp] listen says).
roles = "controller"

# Product modules of this installation (OPS-25): a list of "ipam", "dns", "dhcp" and
# "discovery", or ["all"]. Modules answer what the installation has, roles where a part
# runs. A disabled module registers no API routes, shows no UI area and starts nothing.
# Leave it unset (the default) to let the first-run wizard ask what the installation is
# for (every module otherwise); setting it pins the set and the wizard and settings cannot
# change it. Environment: TENKO_MODULES=ipam,dns. Slice 1 has the IPAM module only.
# modules = ["ipam", "dns", "dhcp", "discovery"]

[node]
# Raft node id. Slice 1 runs a single voter.
id = 1
# Address other nodes reach this node at; empty for a single node.
address = ""

[profile]
# The security profile before first-run setup: home, standard, hardened or lab. It decides
# the listener until the wizard stores the chosen profile and its toggles; from then on the
# stored profile applies and this value is ignored. "hardened" serves TLS 1.3 only, and
# only "lab" allows tls.mode = "plain" (TGL-08).
name = "home"

[server]
# Socket addresses of the API and web UI. Add "[::]:8443" for IPv6.
listen = ["0.0.0.0:8443"]
# Worker threads of the API runtime, 1 to 16 (2 to 4 recommended, ADR 0008).
workers = 2
# Most open connections; more are closed at once.
max_connections = 20000
# Seconds open requests may finish after a shutdown starts.
shutdown_grace_secs = 10
# Seconds for a TLS handshake or a PROXY protocol header.
handshake_timeout_secs = 10
# Seconds for reading the head of an HTTP/1.1 request.
header_read_timeout_secs = 30
# Origins the CSRF guard accepts besides the request's own (development: vite dev).
allowed_origins = []
# Serve the web UI from a directory (debug builds only).
# ui_dir = "ui/dist"

[tls]
# How the listener does TLS (OPS-22):
#   "internal_ca"   (a) a certificate from Tenko's internal CA; install the CA root
#                   (<data_dir>/tls/ca-root.pem) on admin clients.
#   "imported"      (b) your certificate and key in PEM files, reloaded when they change.
#   "reverse_proxy" (c) TLS ends in HAProxy, nginx or Caddy in front of Tenko; plain HTTP
#                   or the PROXY protocol is accepted from trusted_proxies only.
#   "plain"         plain HTTP from every source: the Lab profile only.
mode = "internal_ca"
# Mode a: the certificate name until first-run setup stores a host name (default
# "localhost"); afterwards the host name from setup is the subject and this one an extra name.
# host_name = "ddi.example.org"
# Mode a: further DNS names and IP addresses on the certificate.
alt_names = []
addresses = []
# Mode b: the certificate chain (leaf first) and the private key.
# cert_path = "/etc/tenko/tls/fullchain.pem"
# key_path = "/etc/tenko/tls/privkey.pem"
# Mode b: seconds between checks of the files for changes.
watch_interval_secs = 5
# Mode c: the proxies allowed to connect; forwarded headers from anyone else are refused.
trusted_proxies = []
# Mode c: the proxies send the PROXY protocol (v1 or v2) instead of X-Forwarded-* headers.
proxy_protocol = false
# Mode c: the public host name clients use; also the passkey relying-party ID. The listener
# treats every request as HTTPS at this name, so a client that talks plain HTTP to the
# listener directly (a test, a probe from a trusted address) sends an Origin the CSRF guard
# refuses; add that origin to server.allowed_origins for such use.
# public_host = "ddi.example.org"
# Refuse TLS 1.2 (always on under the Hardened profile).
tls13_only = false
# Send Strict-Transport-Security on HTTPS answers.
hsts = true
# Mode a: hours between checks whether the certificate needs renewal (30 days before expiry).
renew_check_hours = 24

[kek]
# The key-encryption key provider of the vault:
#   "platform"            DPAPI on Windows, systemd-creds on Linux (default)
#   "dpapi"               DPAPI-sealed key generations (Windows)
#   "systemd_creds"       systemd-creds-sealed key generations (Linux; TPM2 where available);
#                         without systemd-creds the key is a plain file and a warning is logged
#   "systemd_credential"  a credential the service manager decrypts (Linux: LoadCredentialEncrypted=
#                         in the unit, host key or TPM2); further generations are wrapped under it
#   "file"                an explicit key file (containers, CI); warns at every start
provider = "platform"
# Directory of the key generations (default <data_dir>/kek).
# dir = "/var/lib/tenko/kek"
# DPAPI: "user" binds the key to the service account (its profile must be loaded);
# "machine" lets any process on the host unseal it.
scope = "user"
# systemd-creds: "auto", "tpm2" or "host". systemd_credential: the key the credential was
# encrypted with, as declared ("tpm2" is reported as TPM2 protection).
with_key = "auto"
# systemd-creds: the tool (default: found on PATH).
# tool = "/usr/bin/systemd-creds"
# systemd_credential: the credential name, as in LoadCredentialEncrypted=<name>:... (default tenko_kek).
# credential = "tenko_kek"
# file: the active key (32 raw bytes, 64 hexadecimal digits or base64), and earlier keys
# still needed until a rotation completes (systemd_credential: earlier credential names).
# path = "/run/secrets/tenko_kek"
retired = []
# Load plain key generations found beside sealed ones. Off: such a generation is refused and
# an alarm is raised, so the key store cannot silently fall back to an unprotected file.
allow_plain = false

[auth]
# The passkey relying-party ID. Default: tls.public_host in mode c, otherwise the host name
# from first-run setup. Use "localhost" for development.
# rp_id = "ddi.example.org"
# Origins the UI is served from (default https://<rp id> on any port).
origins = []
# The name browsers show for the relying party.
rp_name = "Tenko DDI"
# DER or PEM files with attestation roots of accepted hardware security keys (ADR 0010).
attestation_roots = []

[hibp]
# The breached-password check (IAM-04). Whether it runs is the TGL-06 toggle of the stored
# profile; these keys only say where it may look.
# Allow the online range API: only five hexadecimal characters of the password's SHA-1
# leave the host (k-anonymity).
online = true
# A mirror of the range API.
# range_url = "https://api.pwnedpasswords.com/range/"
# The offline filter built with `tenko hibp build <corpus> <filter>`.
# offline_filter = "/var/lib/tenko/hibp.filter"

[sse]
# Server-sent events (ADR 0008).
# Events a subscriber may fall behind before it gets a reset.
channel_capacity = 1024
# Frames kept for Last-Event-ID replay; older ids come from the journal.
ring_capacity = 256
# Seconds between keep-alive comments.
keepalive_secs = 15
# Coalescing window in milliseconds; 0 sends every event at once.
coalesce_ms = 0
# Most change sets replayed for one reconnecting subscriber.
journal_replay_limit = 10000
# Seconds clients wait before reconnecting.
retry_secs = 3
# Most object references in one event.
max_objects_per_event = 500

[rate_limit]
# Request rate limits of the API.
enabled = true
# IPv6 clients are grouped by this many leading bits.
ipv6_prefix_len = 64
# Most keys tracked per limiter (bounds memory).
max_keys = 100000
# Per client address, before authentication. Remove the line to switch it off.
per_ip = { per_second = 20, burst = 100 }
# Per signed-in principal. Remove the line to switch it off.
per_principal = { per_second = 50, burst = 200 }

[store]
# The replicated store (openraft over redb, ADR 0002).
# Page caches in MiB (home-lab defaults, OPS-15).
log_cache_mib = 4
sm_cache_mib = 32
# "deferred": durable checkpoints every checkpoint_interval_ms; "immediate": every apply is
# fsynced. The Raft log is fsynced before every commit either way.
durability = "deferred"
checkpoint_interval_ms = 1000
# Change sets kept for event replay.
journal_retention = 100000
# Snapshot-and-purge: a snapshot after this many entries or MiB of log, keeping this many
# entries behind it.
snapshot_every_entries = 10000
snapshot_every_log_mib = 64
snapshot_keep_entries = 1000
# Seconds a write waits to be applied, and a consistent read to be served.
write_timeout_secs = 60
read_wait_secs = 5
# Durable commits measured by the start-up fsync probe (0 switches it off).
fsync_probe_samples = 20
# Verify every audit record at start instead of the chain head.
verify_full_audit_chain = false

[jobs]
# Jobs driven at once.
workers = 16
# Started jobs per group at once (CONN-09).
default_group_limit = 10
# Seconds a runner lease lasts, and between scans for jobs of other runners.
lease_ttl_secs = 30
scan_interval_secs = 15

[runtime]
# Worker threads of the core runtime (store, authentication, jobs), 1 to 64.
workers = 2

[log]
# Level or filter directive, for example "info" or "info,tenko_store=debug". RUST_LOG takes
# precedence when it is set.
level = "info"
# "text" or "json" (one object per line).
format = "text"
# Also append the log to a file. The Windows service writes to <data_dir>/logs/tenko.log
# when this is not set. The systemd unit creates /var/log/tenko (LogsDirectory=).
# file = "/var/log/tenko/tenko.log"
# Rotate the file at this size in MiB: tenko.log becomes tenko.log.1, tenko.log.1 becomes
# tenko.log.2 and so on. 0 never rotates.
max_file_mb = 64
# Rotated files kept besides the active one (1 to 100); the oldest is removed.
keep_files = 5
# The Windows service also writes events at or above this level to the Application Event
# Log, under the service name as the source: "error", "warn", "info", "debug", "trace" or
# "off". The start and stop of the service are always written. Ignored elsewhere.
event_log = "warn"

[updates]
# In-app updates (OPS-24). Whether the server checks for new versions and how they may be
# installed is the security toggle TGL-23 (Home and Lab: from the UI; Standard: from the UI
# with a fresh sign-in; Hardened: uploaded release files only). The check sends nothing but
# the running version. docs/upgrades.md describes the procedure and the layout that
# installation from the UI needs.
# The release manifest. Release files are downloaded from the same scheme and host only.
source_url = "https://github.com/linkztream/tenko/releases/latest/download/releases.json"
# Never contact the release source: no check, no download. Upload the manifest and the
# release file in the UI instead.
air_gapped = false
# Hours between two checks.
check_interval_hours = 24
# Offer pre-release versions.
prereleases = false
# Seconds a newly installed version has to become ready before the previous one is
# switched back in.
ready_timeout_secs = 180
# Versions kept in <data_dir>/updates besides the ones `current` and `previous` point at.
keep_versions = 2
# The server runs in a container: the UI shows the pull command instead of installing.
# The image sets TENKO_UPDATES__CONTAINER=true; /.dockerenv is recognized as well.
container = false
# The image the pull command names.
image = "ghcr.io/linkztream/tenko"

[cluster]
# The node transport between controllers and data-plane nodes (probe, dns, dhcp): gRPC
# over mutual TLS with certificates from the internal CA (OPS-04). docs/cluster.md
# describes enrolment, renewal, revocation and the firewall rules.
# Controller: socket addresses of the cluster port. Not set: 0.0.0.0:8444, opened once a
# node is enrolled or an enrolment token is waiting. An empty list keeps the port closed.
# listen = ["0.0.0.0:8444"]
# Controller: host:port endpoints nodes are told at enrolment. Empty: the host name a node
# enrols through, with the port of the cluster port.
advertise = []
# Controller: seconds between two heartbeats of a node.
heartbeat_secs = 10
# Controller: lifetime in seconds of an enrolment token whose request names none (at most
# 604800, seven days).
enrolment_ttl_secs = 3600
# Data-plane node: mebibytes the observation buffer keeps on disk while no controller is
# reachable; the oldest batches go first when it is full.
buffer_mib = 64
# Controller in a cluster of controllers (OPS-03, OPS-26): milliseconds without contact to
# a quorum after which this controller counts as isolated. An isolated controller refuses
# writes with 503 cluster.no_quorum and serves reads from its local copy (500 to 60000).
isolation_after_ms = 3000
# Controller in a cluster: seconds a start waits for the local store to catch up with the
# leader before the controller starts isolated (5 to 3600).
catch_up_timeout_secs = 120
# Controller in a cluster: the leader promotes a caught-up learner to a voter on its own,
# and only to an odd number of voters (two voters are less available than one).
auto_promote = true
# Controller in a cluster: a learner counts as caught up while it stays fewer than this many
# log entries behind the leader for 10 seconds.
promote_lag_entries = 100
# Controller: the bandwidth cap of each node's configuration stream in kilobits per second
# (OPS-28); 0 is no cap.
sync_kbps = 0
# Controller in a cluster: dial a peer at another address than the cluster port it
# advertises, from the advertised host:port to the host:port this controller uses
# (split-horizon setups and labs). Default: empty, every peer at its advertised address.
# peer_address_map = { "controller-2.example.test:8444" = "192.0.2.12:8444" }

[telemetry]
# OpenTelemetry traces over OTLP/gRPC (OPS-05), see docs/observability.md section 8. Off
# unless an endpoint is set: no exporter, thread or task runs. http:// or https:// with host
# and port; https:// verifies the collector against the system's root certificates. Traces
# pass the [log] level filter like the console: they need level "info" or lower, and
# RUST_LOG=warn silences them too. Default: not set.
# otlp_endpoint = "http://127.0.0.1:4317"
# The share of traces exported while an endpoint is set, from 0.0 to 1.0; the root of a
# trace decides and its children follow. Default 1.0.
sampling_ratio = 1.0

[metrics]
# The API serves /api/v1/metrics (OpenMetrics text) to a token with the metrics scope.
# Optionally the same text without authentication on a loopback address, for a scraper on
# this host; only 127.0.0.1 or [::1] are accepted. Not set: no such listener.
# listen = "127.0.0.1:9464"
# Seconds between two computations of the gauges read from status interfaces (5 to 3600).
gauge_interval_secs = 30

[backup]
# An absolute directory for backup files (OPS-07). Not set: backups/ in the data directory.
# Prefer another disk. The schedule and how many backups are kept are settings of the
# installation (the API and the UI), the same on every controller; backups are always
# encrypted.
# target_dir = "/srv/backup/tenko"

[audit_export]
# An absolute directory for the files of audit export file sinks (IAM-18). Not set:
# audit-export/ in the data directory. The sinks themselves (syslog over UDP, TCP or TLS,
# or a file, in RFC 5424, CEF or JSON) are settings of the installation (the API and the
# UI), the same on every controller; a file sink writes on the controller that leads.
# file_dir = "/var/log/tenko-audit"

[dns]
# The dns role of this node (docs/dns.md section 8). It runs when "dns" is in roles (on a
# controller node, in the same process) and the DNS module is on; the zones and records
# live in the store, this section only says how this node answers.
#
# Addresses to answer on, UDP and TCP alike. Port 53 needs CAP_NET_BIND_SERVICE on Linux
# (deploy/README.md). A wildcard address answers from the address the host's routing
# picks: on a host with more than one address on a network, list each address instead.
# Environment: TENKO_DNS__LISTEN=192.0.2.53:53,[2001:db8::53]:53
listen = ["0.0.0.0:53", "[::]:53"]
# UDP workers per listen address, 0 to 256; 0 is one per CPU.
workers = 0
# DNS cookies (RFC 7873): "on" answers every query and hands out server cookies;
# "required" answers a UDP query that has a client cookie but no valid server cookie with
# BADCOOKIE (spoofed sources get no amplified answer); "off" ignores cookies.
cookies = "on"
# The default forwarder (docs/dns-resolver.md): the upstream resolvers for names outside the
# zones that no forwarding rule of the store covers. A root rule "." in the store
# (`tenko dns forwarder create . --upstream ...`) wins over this list. Empty: only the rules
# and stub zones of the store forward; other names are refused. Who may recurse at all is
# the recursion access list of the client's view, or the profile's default (Home and
# Standard: the prefixes IPAM knows and loopback; Hardened: nobody; Lab: everyone).
# An entry is an address ("192.0.2.1", "192.0.2.1:5353") or a table
#   { address = "2001:db8::1", port = 53, transport = "tcp" }
#   { address = "192.0.2.1", transport = "dot", tls_name = "resolver.example.test" }
#   { address = "192.0.2.1", transport = "doh", tls_name = "resolver.example.test",
#     path = "/dns-query" }
# transport "udp" (the default) falls back to TCP when an answer is truncated; "dot" is DNS
# over TLS (port 853), "doh" DNS over HTTPS (port 443); both need tls_name, the name in the
# upstream's certificate. No upstream is built in: choose the resolvers your network uses.
# Environment: TENKO_DNS__FORWARDERS=192.0.2.1,192.0.2.2 (plain upstreams only)
forwarders = []
# Milliseconds an upstream has for one attempt (100 to 30000).
forward_timeout_ms = 2000
# Attempts after the first (0 to 5); each goes to another upstream.
forward_retries = 2
# A PEM file with the CA certificates DoT and DoH upstreams are checked against, instead of
# the system's root certificates. Not set: the system's roots.
# upstream_ca = "/etc/tenko/upstream-ca.pem"

[dns.cache]
# The forwarder's cache, per node and per view (docs/dns-resolver.md section 3). Read at
# start; the sizes follow the profile in force when the role starts.
enabled = true
# Entries at most (1 to 10000000). Not set: 10000 under the Home profile, 100000 under the
# others.
# entries = 100000
# Octets of keys, answers and bookkeeping at most (65536 to 17179869184). Not set: 16 MiB
# under the Home profile, 128 MiB under the others.
# max_bytes = 134217728
# Seconds an expired entry may still answer while the upstreams fail (RFC 8767; 0 to
# 604800, 0 turns serve-stale off). A stale answer carries a TTL of 30 seconds.
stale_secs = 86400
# Milliseconds a client waits for an upstream before it gets a stale answer (100 to 30000).
stale_answer_ms = 1800
# The longest lifetime of a positive entry in seconds (1 to 604800).
max_ttl_secs = 86400
# The longest lifetime of a negative entry (NXDOMAIN, NODATA) in seconds (0 to 86400; 0
# keeps none). A negative entry lives for the smaller of its SOA's TTL and MINIMUM.
negative_ttl_secs = 3600
# Ask again for entries asked more than once before they expire (at a tenth of their TTL).
prefetch = true

[dns.udp]
# "auto": a socket per worker with SO_REUSEPORT on Linux, one shared socket elsewhere;
# "reuseport" (Linux only) or "shared" choose. With few clients SO_REUSEPORT can leave
# workers idle (the flow hash); the worker counters of GET /api/v1/nodes/{id}/dns show it.
socket = "auto"
# Socket buffers in octets (0 keeps the system's); the system caps them
# (net.core.rmem_max and net.core.wmem_max on Linux).
recv_buffer = 8388608
send_buffer = 8388608

[dns.tcp]
# Open connections of the node (1 to 100000) and from one client address (1 to 1000).
max_connections = 1000
per_client = 10
# Seconds without a query before a connection is closed (1 to 300).
idle_secs = 10

[dns.edns]
# The EDNS UDP size of the server, 512 to 4096 (1232: DNS flag day 2020).
udp_size = 1232

[dns.log]
# The query log of this node: local files, never in the store; GET /api/v1/nodes/{id}/dns/log
# reads it, and every read is audited. Not set, enabled and days follow the security
# profile (TGL-15): Home off and 7 days, Standard and Hardened on and 30 days, Lab on and
# 7 days. enabled = false is the kill switch across restarts; the node commands
# dns.log.stop and dns.log.start (POST /api/v1/nodes/{id}/dns/log/stop, .../start) switch a
# running log.
# enabled = true
# The directory of the log files. Not set: dns/querylog/ in the data directory.
# path = "/var/log/tenko-dns"
# "jsonl" (JSON lines) or "dnstap" (Frame Streams files for dnstap tools).
format = "jsonl"
# Files are removed after this many days (1 to 365), and the oldest first when the files
# take more than size_mb MiB (1 to 102400).
# days = 30
size_mb = 256
# Log one query in N (1 to 1000000; 1 logs every query).
sample = 1
# Replace client addresses with a keyed hash whose key changes every day (GDPR, TGL-15).
pseudonymise = true
# "logged" or "hidden": with "hidden" no client field is written at all.
client = "logged"

[dns.tls]
# DNS over TLS (RFC 7858) and DNS over HTTPS (RFC 8484) for the clients of this node,
# both off by default (docs/dns-resolver.md section 7). They answer from the same zones,
# views, forwarder and query log as UDP and TCP. Ports 853 and 443 need
# CAP_NET_BIND_SERVICE on Linux, as 53 does (deploy/README.md).
# Environment: TENKO_DNS__TLS__DOT=true, TENKO_DNS__TLS__DOH=true
dot = false
doh = false
# Addresses. Empty: each [dns] listen address on port 853 (DoT) and 443 (DoH). DoH must
# not take the API's port (server.listen): give it another address or port.
dot_listen = []
doh_listen = []
# The certificate: not set, DoT and DoH serve the API's ([tls]: the internal CA's, or the
# imported files, renewed or reloaded without a restart). A chain and key of their own
# (PEM, leaf first), for a certificate in the resolver's name, are watched for changes
# every tls.watch_interval_secs the same way.
# certificate = "/etc/tenko/dns-cert.pem"
# key = "/etc/tenko/dns-key.pem"
# Behind a reverse proxy that ends TLS (HAProxy in TCP mode for DoT, as HTTPS for DoH):
# plain DNS and plain HTTP on the listed internal addresses, only from tls.trusted_proxies.
# proxy_protocol: every connection starts with a PROXY protocol v2 header (send-proxy-v2)
# with the client's address; without it DoH reads X-Forwarded-For.
behind_proxy = false
proxy_protocol = false
# dot_listen = ["127.0.0.1:8853"]
# doh_listen = ["127.0.0.1:8443"]
# Open connections of the node (1 to 100000) and from one client address (1 to 1000),
# per transport and apart from [dns.tcp]; behind a proxy only the node cap applies.
max_connections = 1000
per_client = 10
# Seconds without a query before a connection is closed (1 to 3600).
idle_secs = 30
# Seconds for the TLS handshake and the PROXY header (1 to 60).
handshake_timeout_secs = 5
# Concurrent requests on one HTTP/2 connection (1 to 1000).
doh_streams = 100

[dns.limits]
# Response rate limiting and the per-client query limit (docs/dns-resolver.md section 6),
# read at start. Keys not set follow the security profile (TGL-11): RRL on under Home and
# Standard (20 and 10 per second) and Hardened (5 and 5), off under Lab; the per-client
# limit on only under Hardened (200 queries per second, a burst of 400).
# rrl = true
# Identical answers, NODATA and referrals per second to one client prefix (1 to 10000).
# responses_per_second = 20
# NXDOMAIN and error responses per second to one client prefix (1 to 10000).
# errors_per_second = 10
# Seconds a client prefix may run into debt (1 to 3600).
window_secs = 15
# Every n-th limited response is sent as an empty truncated answer, so that a real client
# retries over TCP (0 to 10; 0 drops every limited response).
slip = 2
# The prefix lengths clients are grouped by.
ipv4_prefix = 24
ipv6_prefix = 56
# Never limit the clients in the prefixes IPAM knows and loopback.
exempt_known = true
# Prefixes never limited.
exempt = []
# Queries per second one client address may send (0 to 100000; 0 is off), and the burst
# above it (not set: twice the rate).
# client_qps = 200
# client_burst = 400
# Slots of each limiter table (1024 to 16777216).
table = 65536

[dns.lists]
# The fetch and the upload of block lists (docs/dns-resolver.md section 5). The lists are
# rows of the store; the leader service dns.lists fetches the URL lists on their intervals.
# Seconds a fetch may take (5 to 600).
fetch_timeout_secs = 60
# MiB a fetched list may have (1 to 1024).
max_download = 64
# MiB an uploaded list may have (1 to 1024): the body limit of PUT /api/v1/dns/lists/{id}/file.
max_upload = 64

# WP7.5: the dhcp role.
[dhcp]
# The dhcp role of this node. It runs when "dhcp" is in roles (on a controller node, in the
# same process) and the DHCP module is on; the scopes, options, classes and leases live in
# the store, this section only says where and how this node listens. Nothing is served
# until `listen` names an address.
#
# Listeners, each a table. Two modes:
#   * "relay" binds the unicast address on the server port: only relayed (unicast) traffic
#     arrives, because the gateway forwards the clients' broadcasts to this address. It
#     needs nothing beyond CAP_NET_BIND_SERVICE on Linux (the base unit has it), works in an
#     unprivileged LXC, in containers with a published UDP port, and on Windows. This is
#     the mode of the reference topology: the gateway relays every network, the node's own
#     included, to one node.
#   * "direct" also hears the broadcasts of clients on the link. On Linux it binds
#     0.0.0.0:67 with SO_BINDTODEVICE to `interface` and answers a client that has no
#     address yet by a link-layer unicast through an AF_PACKET socket; that needs
#     CAP_NET_RAW, AF_PACKET and AF_NETLINK (the drop-in deploy/systemd/dhcp-direct.conf),
#     and without them it answers by broadcast. On Windows it binds the interface's
#     address and answers by broadcast.
# `interface` is required for "direct". UDP 547 (DHCPv6) is not served yet; it joins in
# Slice 9.
# Environment: TENKO_DHCP__LISTEN='[{ address = "192.0.2.10", mode = "relay" }]'
listen = []
# listen = [{ address = "192.0.2.10", mode = "relay" }]
# listen = [{ address = "192.0.2.10", mode = "direct", interface = "eth0" }]
# The server port. Another port is for tests and labs: clients and relay agents send to 67.
port = 67
# UDP workers per listener (0 to 8); 0 is one per CPU, at most 8.
workers = 0
# Seconds an offer holds its address in memory (1 to 300), until the client requests it or
# the offer expires.
offer_secs = 10
# The port that replies to relay agents go to (tests and labs use another).
relay_port = 67
# The port that replies to clients go to.
client_port = 68

[dhcp.probe]
# The conflict probe before an address is offered (WP8.5, TGL-16; docs/dhcp.md section 14).
# It runs when the probe role runs in this process: ARP on this node's links (Linux with
# CAP_NET_RAW), ICMP echo elsewhere. An address never leased to the client waits for it:
# the offer goes out when nobody answered, or at the latest timeout_ms after the DISCOVER
# (10 to 1000); an address that answers is held for [dhcp.decline] hold_secs and the next
# one is offered. A clean result is remembered for cache_secs (0 to 86400); pending offers
# may wait at once (16 to 65536), beyond that an offer goes out unprobed. The setting
# conflict_detection of the DHCP settings (or the profile: off under Lab) switches it.
timeout_ms = 300
cache_secs = 600
pending = 1024

[dhcp.decline]
# How long an address a client declined, or the probe found in use, stays abandoned, in
# seconds (60 to 2592000). A client may decline at most limit addresses per window_secs
# (0 to 100 per 60 to 86400 seconds); a DECLINE beyond is dropped and the client keeps its
# lease, so a broken client cannot drain a pool.
hold_secs = 86400
limit = 3
window_secs = 3600

[dhcp.ddns]
# The dynamic DNS updates of leases (WP8.3): attempts after the first, and the wait before
# the first retry in milliseconds (it doubles for each further attempt).
retries = 5
backoff_ms = 1000

[dhcp.history]
# Days the lease history is kept on this node, overriding the default of the security
# profile (Home 30, Standard and Hardened 90, Lab 7). Not set: the profile's default.
# days = 30

[scan]
# The scanner of the probe role (SCAN-01 to SCAN-09). A probe reads this section of its own
# tenko.toml until the controller hands out scan configuration (a later release).
# docs/scanning.md describes the methods, what each needs and what it reports, and how to
# allow-list the probe in IDS and EDR products.
enabled = true
# The prefixes this probe covers; nothing outside them is probed or reported. Empty: the
# scanner scans nothing.
prefixes = []
# prefixes = ["192.0.2.0/24", "2001:db8:10::/64"]
# Prefixes and addresses inside `prefixes` that are never probed or reported.
exclude = []
# The VRF of the addresses (a VRF id); not set: the VRF of the enrolment token, else the
# default VRF.
# vrf = "..."
# Active probing (TGL-18): ICMP sweeps and TCP connect scans. false keeps the probe passive
# (neighbour tables, mDNS, LLMNR, reverse DNS, SNMP).
active = true
# Rate profile (TGL-19): normal (100 probes/s), slow (50), slowest (10) or unlimited.
rate = "normal"
# packets_per_second = 100
# Minimum milliseconds between two probes to the same address.
per_host_interval_ms = 100
# Most probes in flight at once.
concurrency = 32
# Largest IPv4 prefix, in addresses, that a sweep enumerates; larger prefixes and IPv6
# networks are covered through the addresses the other methods saw.
max_hosts_per_prefix = 4096
# Blackout windows: no method that sends packets runs in them, and a run that reaches one
# stops. Days: daily, weekdays, weekends, mon to sun, ranges and lists (mon-fri, sat,sun).
blackout = []
# blackout = ["mon-fri 08:00-17:00", "sun 22:00-02:00"]
# The time zone of the blackout windows (an IANA name); not set: the system time zone.
# timezone = "Europe/Stockholm"

[scan.arp]
# IPv4 neighbours from the operating system's ARP table; sends nothing.
enabled = true
interval_secs = 300
# Seconds a sighting stays current; default three intervals, at least 15 minutes.
# ttl_secs = 900

[scan.nd]
# IPv6 neighbours from the operating system's neighbour table; sends nothing.
enabled = true
interval_secs = 300

[scan.icmp]
# ICMP echo sweeps through the operating system (needs `active`).
enabled = true
interval_secs = 1800
timeout_ms = 1000

[scan.tcp_connect]
# TCP connect scans with a TLS hint per open port (needs `active`).
enabled = true
interval_secs = 21600
ports = [21, 22, 23, 25, 53, 80, 110, 135, 139, 143, 389, 443, 445, 515, 548, 554, 631, 636, 1883, 3306, 3389, 5432, 5900, 6053, 8006, 8080, 8123, 8443]
timeout_ms = 1500
tls_hint = true
# known: the addresses the other methods saw; all: every address of the prefixes too.
targets = "known"

[scan.reverse_dns]
# PTR lookups of the discovered addresses.
enabled = true
interval_secs = 3600
# DNS servers; empty: the resolvers of this host.
servers = []
timeout_ms = 2000

[scan.mdns]
enabled = true
interval_secs = 900
# Seconds to collect answers and announcements per run.
listen_secs = 4
# Also listens on port 5353 for announcements, shared with other responders on the host.
passive = true
group = "224.0.0.251:5353"
unicast_port = 5353

[scan.llmnr]
enabled = true
interval_secs = 3600
timeout_ms = 1000
port = 5355

[scan.snmp]
# SNMPv3 polling of switches: ARP, bridge and LLDP tables.
enabled = true
interval_secs = 900
timeout_ms = 2000
retries = 2
# Also report clients behind ports with an LLDP neighbour (access points, other switches).
attach_on_lldp_ports = false
# The credentials are read from this file until the controller delivers them from the
# vault: keep the passwords in files only tenko can read.
# [[scan.snmp.devices]]
# address = "192.0.2.2"
# name = "switch-a.example.net"
# user = "tenko"
# auth = "sha256"          # sha1, sha224, sha256, sha384 or sha512
# auth_password_file = "/etc/tenko/snmp-switch-a-auth"
# privacy = "aes128"
# privacy_password_file = "/etc/tenko/snmp-switch-a-priv"

# Methods that need raw sockets (CAP_NET_RAW on Linux, Npcap on Windows; docs/scanning.md
# section 9). All off by default; enable the ones you want once the host is set up.
#
# ARP sweep: an active sweep of the IPv4 scope (needs `active`).
[scan.arp_sweep]
enabled = false
# timeout_ms = 2000           # wait for ARP replies after the last request
# interface = "eth0"          # override the interface the probe's address chooses
#
# TCP SYN scan: a half-open port scan (needs `active`). The port list may hold ranges and
# up to the full 65,535 ports, which the connect scan cannot.
[scan.tcp_syn]
enabled = false
# ports = [22, 80, 443, "1-1024"]
# targets = "known"           # "known" or "all"
# timeout_ms = 2000
#
# OS fingerprinting: SYNs a short port list and classifies the SYN-ACKs (needs `active`).
[scan.os_fingerprint]
enabled = false
# ports = [22, 80, 135, 139, 443, 445, 3389]
# timeout_ms = 2000
#
# Passive LLDP and CDP listening (sends nothing).
[scan.lldp]
enabled = false
# listen_secs = 35            # raised to at least 65 when cdp is on
# cdp = true                  # also parse Cisco Discovery Protocol frames
#
# Passive DHCPv4 snooping (sends nothing).
[scan.dhcp_snoop]
enabled = false
# listen_secs = 120
