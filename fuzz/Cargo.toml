[package]
name = "tenko-fuzz"
version = "0.0.0"
description = "cargo-fuzz targets for the parsers of network input"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: the main workspace excludes `fuzz/`.
[workspace]

[dependencies]
bytes = "1"
libfuzzer-sys = "0.4"
serde_json = "1"
tenko = { path = "../crates/tenko", default-features = false }
# `server` for the multipart parser of `POST /imports` (`api_multipart`).
tenko-api = { path = "../crates/tenko-api", default-features = false, features = ["server"] }
tenko-auth = { path = "../crates/tenko-auth" }
tenko-connect-hass = { path = "../crates/tenko-connect-hass" }
tenko-connect-proxmox = { path = "../crates/tenko-connect-proxmox" }
tenko-connect-unifi = { path = "../crates/tenko-connect-unifi" }
tenko-cluster = { path = "../crates/tenko-cluster" }
tenko-core = { path = "../crates/tenko-core" }
# The DHCPv4 wire codec of the `dhcp_v4` target.
tenko-dhcp = { path = "../crates/tenko-dhcp" }
tenko-dns = { path = "../crates/tenko-dns" }
tenko-scan = { path = "../crates/tenko-scan" }
# The read view of the `dns_zonefile` target.
tenko-store = { path = "../crates/tenko-store" }
tenko-vault = { path = "../crates/tenko-vault" }

[[bin]]
name = "scan_dns_message"
path = "fuzz_targets/scan_dns_message.rs"
test = false
doc = false
bench = false

